<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게시글 — 제주이음</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261107c">
<style>
.post-view{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px 34px;max-width:860px;margin:0 auto;box-shadow:var(--sh-2)}
.pv-board{font-size:12px;font-weight:800;color:var(--sea-600);margin-bottom:9px;letter-spacing:.04em}
.pv-title{font-size:25px;font-weight:800;letter-spacing:-0.045em;line-height:1.38;color:var(--ink)}
.pv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);margin:10px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.pv-meta>span{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pv-meta .own-tag,.pv-meta .pv-msg{white-space:nowrap;flex:0 0 auto}
.pv-extra{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 18px;font-size:14px;margin-bottom:20px;display:flex;gap:28px;flex-wrap:wrap;color:var(--ink-3)}
.pv-extra b{color:var(--ink);font-weight:800;letter-spacing:-0.02em}
.pv-content{font-size:16px;line-height:1.85;white-space:pre-wrap;min-height:130px;color:var(--ink-2);letter-spacing:-0.015em}
.pv-actions{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.pv-join{background:linear-gradient(140deg,var(--bg-2),#fff);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:24px;box-shadow:var(--sh-1)}
.pv-join .jt{font-size:14.5px;font-weight:800;margin-bottom:12px}
.pv-join .progress{height:9px;background:#e6eaed;border-radius:6px;overflow:hidden;margin:0 0 8px}
.pv-join .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--tangerine),#f6a94f);border-radius:6px}
.pv-join .jmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px}
.pv-join .jmeta b{color:#c96a08}
.pv-join .btn{width:100%;padding:13px;font-size:15px}
.pv-join .jnote{font-size:12.5px;color:var(--muted);margin-top:9px;text-align:center}
.cmt-wrap{max-width:860px;margin:18px auto 0}
.cmt-head{font-size:16px;font-weight:800;margin-bottom:12px;letter-spacing:-0.035em;color:var(--ink)}
.cmt-head b{color:var(--sea)}
.cmt-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px;margin-bottom:9px;box-shadow:var(--sh-1)}
.cmt-item .who{font-size:13px;font-weight:700}
.cmt-item .when{font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.cmt-reply{margin-left:34px;display:flex;gap:10px;background:var(--bg-2,#f8fafc);border-left:3px solid var(--sea,#2b8ce6)}
.cmt-reply .reply-arrow{font-size:18px;color:var(--sea,#2b8ce6);font-weight:800;line-height:1.2;flex-shrink:0}
.cmt-reply .reply-body{flex:1;min-width:0}
.cmt-reply .reply-to{font-size:12px;font-weight:700;color:var(--sea-600,#1a71c8);margin-bottom:3px}
@media (max-width:680px){.cmt-reply{margin-left:16px}}
.cmt-item p{font-size:14.5px;margin-top:4px}
.cmt-form{display:flex;gap:8px;margin-top:12px}
.cmt-form input{flex:1;border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none}
.cmt-form input:focus{border-color:var(--sea)}
.cmt-login{background:var(--sand);border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;font-size:14px;color:var(--muted);margin-top:12px}
.cmt-login a{color:var(--sea);font-weight:700}
</style>
</head>
<body data-active="">

<main class="wrap">
  <article class="post-view" id="pv"></article>

  <div class="cmt-wrap">
    <div class="cmt-head"><span class="cmt-ico">💬</span>댓글 <b id="cmt-count">0</b></div>
    <div id="cmt-list"></div>
    <div id="cmt-input"></div>
  </div>
</main>

<script src="assets/kmap.js?v=20261107c"></script>
<script src="assets/common.js?v=20261107c"></script>
<script src="assets/db.js?v=20261107c"></script>
<script src="assets/notify.js?v=20261107c"></script>
<script src="assets/seed-trade.js?v=20261107c"></script>
<script src="assets/seed-extra.js?v=20261107c"></script>
<script src="assets/seed-new.js?v=20261107c"></script>
<script src="assets/seed-comments.js?v=20261107c"></script>
<script src="assets/admin-data.js?v=20261107c"></script>
<script>
var id = new URLSearchParams(location.search).get("id");
var post = findPost(id);
function esc(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

var TRADE_PAGE = {
  "구인구직":"jobs.html", "부동산":"realestate.html", "중고사고팔기":"market.html",
  "제주상점":"shops.html", "동호회":"clubs.html", "특가공구":"deals.html", "축제정보":"festivals.html"
};

/* 동호회 가입 / 공구 참여 영역 */
function joinBlock(p){
  if (p.board === "동호회" && window.JIDB && JIDB.enabled) {
    if (!p.db) return '<div class="pv-join"><div class="jt">🤝 이 모임에 함께하기</div><div class="jnote">이 모임은 화면 구성을 보여 드리기 위한 예시라 가입 신청을 받을 수 없어요.</div></div>';
    return '<div class="pv-join" id="club-join"><div class="jt">🤝 이 모임에 함께하기</div><div class="jnote">불러오는 중…</div></div>';
  }
  if (p.board === "동호회") {
    var jid = "club-" + p.id;
    return '<div class="pv-join">' +
      '<div class="jt">🤝 이 모임에 함께하기</div>' +
      (p.meta ? '<div class="jmeta"><span>' + esc(p.meta) + '</span><b>' + esc(p.loc || "전역") + '</b></div>' : '') +
      '<button type="button" class="btn primary" data-join="' + jid + '" data-kind="club" ' +
      'data-on="가입 신청 완료 ✓ (다시 누르면 취소)" data-off="가입 신청">가입 신청</button>' +
      '<div class="jnote">신청하면 모임장이 확인 후 단체 안내를 보내드립니다.</div>' +
      '</div>';
  }
  if (p.board === "특가공구") {
    var did = "deal-" + p.id;
    var pct = (p.cur && p.goal) ? Math.min(100, Math.round(p.cur / p.goal * 100)) : 0;
    var bar = (p.cur && p.goal)
      ? '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
        '<div class="jmeta"><span>' + p.cur + ' / ' + p.goal + ' 참여 (' + pct + '%)</span><b>' + esc(p.dday || "진행중") + '</b></div>'
      : '<div class="jmeta"><span>모집 진행중</span><b>' + esc(p.dday || "") + '</b></div>';
    return '<div class="pv-join">' +
      '<div class="jt">⚡ 이 공구에 참여하기</div>' + bar +
      '<button type="button" class="btn accent" data-join="' + did + '" data-kind="deal" ' +
      'data-on="참여 완료 ✓ (다시 누르면 취소)" data-off="참여하기">참여하기</button>' +
      '<div class="jnote">목표 인원이 모이면 확정되고, 결제 안내를 따로 보내드립니다.</div>' +
      '</div>';
  }
  return "";
}

function renderPost() {
if (!post) {
  document.getElementById("pv").innerHTML =
    '<p style="padding:30px;text-align:center;color:var(--muted)">게시글을 찾을 수 없습니다.</p>' +
    '<div class="pv-actions"><a class="btn ghost" href="community.html">목록으로</a></div>';
} else {
  addViews(id);
  document.title = post.title + " — 제주이음";

  var extra = "";
  if (post.board === "구인구직" && (post.payType || post.addr)) {
    extra = '<div class="pv-extra">' +
      (post.payType ? '<span>급여 <b>' + esc(payText(post)) + '</b></span>' : '') +
      (post.addr ? '<span>근무지 <b>' + esc(post.addr) + '</b></span>' : '') +
      '</div>';
  } else if (post.price || post.loc || post.period) {
    extra = '<div class="pv-extra">' +
      (post.period ? '<span>기간 <b>' + esc(post.period) + '</b></span>' : '') +
      (post.price ? '<span>가격 <b>' + esc(post.price) + '원</b></span>' : '') +
      (post.loc ? '<span>' + (post.period ? '장소' : '지역') + ' <b>' + esc(post.loc) + '</b></span>' : '') +
      (post.addr ? '<span>주소 <b>' + esc(post.addr) + '</b></span>' : '') +
      '</div>';
  }

  var backHref = TRADE_PAGE[post.board] ||
    (post.board && post.board !== "공지" ? "community.html?board=" + encodeURIComponent(post.board) : "community.html");

  document.getElementById("pv").innerHTML =
    '<div class="pv-board">' + esc(post.board) + (post.head && post.head !== post.board ? ' · ' + esc(post.head) : '') + '</div>' +
    '<h1 class="pv-title">' + (post.head === "채용완료" ? '<span class="closed-tag">채용완료</span>' : '') + esc(post.title) + '</h1>' +
    '<div class="pv-meta"><span>✍️ ' + esc(post.author) + (isMyPost(post) ? ' <span class="own-tag big">' + (post.board === "동호회" ? "👑 내 모임" : "✍️ 내 글") + '</span>' : msgLink(post.authorId, post.author)) + '</span>' +
    '<span>🕐 ' + esc(post.date) + (post.time ? ' ' + esc(post.time) : '') + '</span><span>👁 ' + viewsOf(post).toLocaleString() + '</span>' + likeBtnHtml(post) + '</div>' +
    extra +
    galleryHtml(post) +
    '<div class="pv-content">' + esc(post.content || "(내용 없음)") + '</div>' +
    (post.board === "구인구직" && isMyPost(post)
      ? '<div class="job-status' + (post.head === "채용완료" ? " done" : "") + '"><div><b>' + (post.head === "채용완료" ? "✅ 채용이 끝난 공고예요" : "📢 지금 모집 중인 공고예요") + '</b>' +
        '<span>' + (post.head === "채용완료" ? "목록에 '채용완료'로 흐리게 표시되고 있어요." : "사람을 구했으면 채용완료로 바꿔 주세요. 목록에 바로 표시돼요.") + '</span></div>' +
        '<button type="button" class="btn ' + (post.head === "채용완료" ? "ghost" : "primary") + '" onclick="closeJob()">' + (post.head === "채용완료" ? "다시 모집하기" : "✅ 채용완료로 바꾸기") + '</button></div>'
      : '') +
    (post.board === "부동산" || (post.board === "구인구직" && post.addr) ? '<div class="pv-map"><h3>' + (post.board === "구인구직" ? "근무지 위치" : "매물 위치") + '</h3><div id="pv-map"></div></div>' : '') +
    joinBlock(post) +
    '<div class="pv-actions"><a class="btn ghost" href="' + backHref + '">목록으로</a>' +
    (isMyPost(post)
      ? '<div class="own-actions">' +
        '<button class="mini-btn" onclick="editPost()">수정</button>' +
        '<button class="mini-btn danger-btn" onclick="removePost()">삭제</button></div>'
      : '') +
    '</div>';
  if (post.board === "구인구직" && post.addr) JIMap.show(document.getElementById("pv-map"), post.addr);
  if (post.board === "부동산") {
    var mq = post.addr || (post.loc ? "제주특별자치도 " + post.loc : "");
    if (mq) JIMap.show(document.getElementById("pv-map"), mq, { approx: !post.addr });
    else document.getElementById("pv-map").innerHTML = '<p class="km-none">등록된 주소가 없어요.</p>';
  }

  // '목록으로·수정·삭제'는 댓글 아래로
  var acts = document.querySelector("#pv .pv-actions"), cw = document.querySelector(".cmt-wrap");
  if (acts && cw) { acts.classList.add("pv-actions-bottom"); cw.parentNode.insertBefore(acts, cw.nextSibling); }
  paintAllJoinBtns();
  renderComments();
  if (post.db && post.board === "동호회") drawClubJoin();
}
}

if (!post && window.JIDB && JIDB.enabled && JIDB.isUuid(id)) {
  document.getElementById("pv").innerHTML = '<p style="padding:30px;text-align:center;color:var(--muted)">불러오는 중…</p>';
  JIDB.getPost(id, true).then(function (p) { post = p; renderPost(); }, function () { renderPost(); });
} else {
  renderPost();
  // 서버 글이면 최신 내용 확인 + 조회수 올리기
  if (post && post.db && window.JIDB && JIDB.enabled) JIDB.getPost(id, true).then(function (p) {
    if (!p) { alert("삭제된 글입니다."); history.back(); return; }
    if (p.title !== post.title || p.content !== post.content || p.head !== post.head) { post = p; renderPost(); }
  }, function () {});
}

/* ── 모임 공지 (모임장·승인 회원만) ── */
function drawNotices(isOwner) {
  var el = document.getElementById("club-notices"); if (!el) return;
  JIDB.clubNotices(post.id).then(function (list) {
    el.innerHTML = '<div class="cn-head">📢 모임 공지 <small>' + list.length + '</small></div>' + (list.length ? list.map(function (n) {
      var d = new Date(n.created_at);
      return '<div class="cn-item"><div class="cn-when">' + (d.getMonth() + 1) + '.' + d.getDate() + ' ' + d.toTimeString().slice(0, 5) +
        (isOwner ? '<button type="button" class="mini-btn danger-btn" data-del="' + n.id + '">삭제</button>' : '') + '</div>' +
        '<div class="cn-body">' + linkify(esc(n.body)) + '</div></div>';
    }).join("") : '<div class="cn-empty">' + (isOwner ? '아직 올린 공지가 없어요.' : '아직 모임장의 공지가 없어요. 올라오면 알림으로 알려 드려요.') + '</div>');
    if (location.hash === "#club-notices") el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  el.onclick = function (e) {
    var b = e.target.closest("button[data-del]"); if (!b) return;
    if (confirm("이 공지를 삭제할까요?")) JIDB.deleteNotice(b.dataset.del).then(function () { drawNotices(true); });
  };
}
function linkify(h) { return h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>').replace(/\n/g, "<br>"); }

/* ── 동호회 가입 신청 (데이터베이스) ── */
function drawClubJoin() {
  var box = document.getElementById("club-join"); if (!box) return;
  var u = currentUser();
  var head = '<div class="jt">🤝 이 모임에 함께하기</div>' +
    (post.meta ? '<div class="jmeta"><span>' + esc(post.meta) + '</span><b>' + esc(post.loc || "전역") + '</b></div>' : '');
  if (u && u.id && post.authorId === u.id) {
    JIDB.clubMembers(post.id).then(function (ms) {
      var ok = ms.filter(function (m) { return m.status === "approved"; }), pend = ms.filter(function (m) { return m.status === "pending"; }).length;
      box.innerHTML = head +
        '<div class="cj-owner"><div class="cj-stat"><b>' + ok.length + '</b>명 함께해요' + (pend ? ' · <a href="activity.html#received">새 신청 ' + pend + '건 →</a>' : '') + '</div>' +
        (ok.length ? '<div class="cj-members">' + ok.map(function (m) { return '<span>' + esc(m.applicant_nick) + '</span>'; }).join("") + '</div>' : '') + '</div>' +
        '<div class="cj-compose"><label for="notice-body">📢 회원들에게 안내 남기기</label>' +
        '<textarea id="notice-body" maxlength="1000" rows="3" placeholder="예: 첫 모임은 11월 16일(토) 오전 9시 김녕 해변 주차장이에요. 단체 대화방: (오픈채팅 주소)"></textarea>' +
        '<button type="button" class="btn primary" id="notice-send"' + (ok.length ? '' : ' disabled') + '>공지 올리기</button>' +
        '<div class="jnote">' + (ok.length ? '승인된 회원 ' + ok.length + '명에게 알림이 가요. 공지는 회원만 볼 수 있어요.' : '승인된 회원이 생기면 공지를 올릴 수 있어요.') + '</div></div>' +
        '<div id="club-notices"></div>';
      var send = document.getElementById("notice-send");
      send.onclick = function () {
        var t = document.getElementById("notice-body").value.trim(); if (!t) { alert("안내 내용을 적어 주세요."); return; }
        send.disabled = true;
        JIDB.addNotice(post, t).then(drawClubJoin, function (e) { alert("올리지 못했어요: " + (e.message || e)); send.disabled = false; });
      };
      drawNotices(true);
    });
    return;
  }
  if (!u || !u.id) {
    box.innerHTML = head + '<a class="btn primary" href="login.html?next=' + encodeURIComponent("view.html?id=" + id) + '">로그인하고 가입 신청</a>' +
      '<div class="jnote">신청하면 모임장에게 바로 알림이 가요.</div>';
    return;
  }
  JIDB.myJoin(post.id).then(function (j) {
    if (!j) {
      box.innerHTML = head +
        '<textarea id="join-msg" maxlength="300" rows="2" placeholder="모임장에게 한마디 (선택) — 예: 주말 오전에 참여할 수 있어요"></textarea>' +
        '<button type="button" class="btn primary" id="join-send">가입 신청</button>' +
        '<div class="jnote">신청하면 모임장에게 바로 알림이 가고, 결과도 알림으로 알려 드려요.</div>';
      document.getElementById("join-send").onclick = function () {
        this.disabled = true;
        JIDB.requestJoin(post, document.getElementById("join-msg").value.trim()).then(drawClubJoin)
          .catch(function (e) { alert("신청하지 못했어요: " + (e.message || e)); drawClubJoin(); });
      };
      return;
    }
    var ST = { pending: ["⏳ 승인 대기 중", "모임장이 확인하면 알림으로 알려 드려요."], approved: ["🎉 가입 승인됨", "모임장이 안내를 올리면 아래 '모임 공지'에 보이고 알림도 가요."], rejected: ["이번에는 함께하기 어려워요", "다른 모임도 둘러보세요."] };
    var st = ST[j.status] || ST.pending;
    box.innerHTML = head + '<div class="join-st s-' + j.status + '"><b>' + st[0] + '</b><span>' + st[1] + '</span></div>' +
      (j.status === "pending" ? '<button type="button" class="btn ghost" id="join-cancel">신청 취소</button>' : '');
    var c = document.getElementById("join-cancel");
    if (c) c.onclick = function () { if (confirm("가입 신청을 취소할까요?")) JIDB.cancelJoin(j.id).then(drawClubJoin); };
    if (j.status === "approved") { box.insertAdjacentHTML("beforeend", '<div id="club-notices"></div>'); drawNotices(false); }
  });
}

/* 좋아요 버튼 */
function likeBtnHtml(p) {
  var on = typeof likedByMe === "function" && likedByMe(p.id);
  return '<button type="button" class="pv-like' + (on ? ' on' : '') + '" id="pv-like" onclick="toggleLikeBtn()" aria-pressed="' + on + '" title="' + (on ? '좋아요 취소' : '좋아요') + '">' +
    '<span class="hz">' + (on ? '♥' : '♡') + '</span> <b id="pv-like-n">' + likesOf(p).toLocaleString() + '</b></button>';
}
function toggleLikeBtn() {
  if (!(window.JIDB && JIDB.enabled)) return;
  var u = currentUser();
  if (!u || !u.id) { if (confirm("로그인하면 좋아요를 누를 수 있어요. 로그인할까요?")) location.href = "login.html?next=" + encodeURIComponent(location.pathname.split("/").pop() + location.search); return; }
  var b = document.getElementById("pv-like"); b.disabled = true;
  JIDB.toggleLike(post.id).then(function (r) {
    b.outerHTML = likeBtnHtml(post);
    if (r.liked) { var nb = document.getElementById("pv-like"); nb.classList.add("pop"); }
  }, function (e) { b.disabled = false; alert(e.message || e); });
}

/* 글 사진 보기 */
var PV_PH, PV_I;   // 값은 galleryHtml 에서 (글 그리기가 이 줄보다 먼저 실행될 수 있음)
function galleryHtml(p) {
  PV_PH = (p && p.extra && Array.isArray(p.extra.photos)) ? p.extra.photos : []; PV_I = 0;
  if (!PV_PH.length) return "";
  var many = PV_PH.length > 1;
  return '<div class="pv-gallery"><div class="pv-main"><img id="pv-img" src="' + esc(PV_PH[0]) + '" alt="첨부 사진 1" onclick="window.open(this.src,\'_blank\')">' +
    (many ? '<button type="button" class="pv-nav l" onclick="pvGo(-1)" aria-label="이전 사진">‹</button><button type="button" class="pv-nav r" onclick="pvGo(1)" aria-label="다음 사진">›</button>' +
      '<span class="pv-count" id="pv-count">1 / ' + PV_PH.length + '</span>' : '') + '</div>' +
    (many ? '<div class="pv-thumbs" id="pv-thumbs">' + PV_PH.map(function (u, i) { return '<button type="button" class="' + (i ? '' : 'on') + '" onclick="pvShow(' + i + ')"><img src="' + esc(u) + '" alt="" loading="lazy"></button>'; }).join("") + '</div>' : '') + '</div>';
}
function pvShow(i) {
  PV_I = (i + PV_PH.length) % PV_PH.length;
  var im = document.getElementById("pv-img"); im.src = PV_PH[PV_I]; im.alt = "첨부 사진 " + (PV_I + 1);
  var c = document.getElementById("pv-count"); if (c) c.textContent = (PV_I + 1) + " / " + PV_PH.length;
  document.querySelectorAll("#pv-thumbs button").forEach(function (b, j) { b.classList.toggle("on", j === PV_I); });
}
function pvGo(d) { pvShow(PV_I + d); }

/* 회원에게 쪽지 보내기 링크 (서버 회원 글·댓글에만) */
function msgLink(uid, nick) {
  if (!uid || !(window.JIDB && JIDB.enabled)) return "";
  var u = currentUser(); if (u && u.id === uid) return "";
  return ' <a class="pv-msg" href="messages.html?to_id=' + encodeURIComponent(uid) + '&to=' + encodeURIComponent(nick || "") + '" title="' + esc(nick) + '님에게 쪽지">✉️ 쪽지</a>';
}
var DB_CMTS = [], dbCmtLoaded = false;
function loadDbComments() {
  if (!(window.JIDB && JIDB.enabled)) return;
  JIDB.comments(id).then(function (l) { DB_CMTS = l; dbCmtLoaded = true; renderComments(); }, function () {});
}
function dbCmtHtml() {
  var u = currentUser();
  return DB_CMTS.map(function (c, i) {
    var own = u && u.id && c.authorId === u.id;
    var isAuthor = post && post.authorId && c.authorId === post.authorId;
    return '<div class="cmt-item" id="dcmt-' + i + '"><div style="display:flex;align-items:center">' +
      '<span class="who">' + esc(c.author) + (isAuthor ? ' <span class="own-tag">작성자</span>' : '') + (own ? '' : msgLink(c.authorId, c.author)) + '</span>' +
      '<span class="when">' + esc(c.date) + (c.edited ? ' (수정됨)' : '') + '</span>' +
      '<button type="button" class="cmt-like' + (c.liked ? ' on' : '') + '" onclick="likeDbCmt(' + i + ')" aria-pressed="' + !!c.liked + '" title="' + (c.liked ? '좋아요 취소' : '좋아요') + '">' + (c.liked ? '♥' : '♡') + (c.likes ? ' ' + c.likes : '') + '</button>' +
      (own ? '<div class="own-actions"><button class="mini-btn" onclick="startEditDbCmt(' + i + ')">수정</button>' +
        '<button class="mini-btn danger-btn" onclick="removeDbCmt(' + i + ')">삭제</button></div>'
        : (isMod() ? '<div class="own-actions"><button class="mini-btn danger-btn" onclick="removeDbCmt(' + i + ')" title="관리자·스텝 권한">삭제</button></div>' : '')) +
      '</div><p id="dcmt-text-' + i + '">' + esc(c.text) + '</p></div>';
  }).join("");
}
function likeDbCmt(i) {
  var c = DB_CMTS[i]; if (!c) return;
  var u = currentUser();
  if (!u || !u.id) { if (confirm("로그인하면 좋아요를 누를 수 있어요. 로그인할까요?")) location.href = "login.html?next=" + encodeURIComponent(location.pathname.split("/").pop() + location.search); return; }
  JIDB.toggleLike("c:" + c.id).then(function (r) { c.liked = r.liked; c.likes = r.count; renderComments(); }, function (e) { alert(e.message || e); });
}
function startEditDbCmt(i) {
  var c = DB_CMTS[i]; if (!c) return;
  document.getElementById("dcmt-text-" + i).outerHTML = '<div class="edit-box" id="dcmt-text-' + i + '"><input type="text" id="dcmt-edit-' + i + '" maxlength="300">' +
    '<button class="btn primary" onclick="saveDbCmt(' + i + ')">저장</button><button class="btn ghost" onclick="renderComments()">취소</button></div>';
  var inp = document.getElementById("dcmt-edit-" + i); inp.value = c.text; inp.focus();
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") saveDbCmt(i); });
}
function saveDbCmt(i) {
  var t = document.getElementById("dcmt-edit-" + i).value.trim(); if (!t) { alert("댓글 내용을 입력해주세요."); return; }
  JIDB.updateComment(DB_CMTS[i].id, t).then(function (c) { DB_CMTS[i] = c; renderComments(); }, function (e) { alert(e.message || e); });
}
function removeDbCmt(i) {
  if (!confirm("이 댓글을 삭제할까요?")) return;
  JIDB.deleteComment(DB_CMTS[i].id).then(function () { DB_CMTS.splice(i, 1); renderComments(); }, function (e) { alert(e.message || e); });
}
function renderComments() {
  if (!DB_CMTS) DB_CMTS = [];   // 글을 그리는 코드가 이 선언보다 먼저 실행될 때 대비
  if (!dbCmtLoaded && window.JIDB && JIDB.enabled) { dbCmtLoaded = true; loadDbComments(); }
  var all = JI.get("comments", {});
  var list = all[id] || [];
  var seeds = seedCommentsOf(id);
  document.getElementById("cmt-count").textContent = seeds.length + list.length + DB_CMTS.length;
  var seedHtml = seeds.map(function(c){
    var isAuthor = post && c.author === post.author;
    var isReply = c.reply !== undefined && seeds[c.reply];
    var who = '<span class="who">' + esc(c.author) + (isAuthor ? ' <span class="own-tag">작성자</span>' : '') + '</span>';
    if (isReply) {
      return '<div class="cmt-item cmt-reply"><span class="reply-arrow" aria-hidden="true">↳</span><div class="reply-body">' +
        '<div class="reply-to">@' + esc(seeds[c.reply].author) + ' 님에게 답글</div>' +
        '<div style="display:flex;align-items:center">' + who + '<span class="when">' + esc(c.date) + '</span></div>' +
        '<p>' + esc(c.text) + '</p></div></div>';
    }
    return '<div class="cmt-item"><div style="display:flex;align-items:center">' + who +
      '<span class="when">' + esc(c.date) + '</span></div><p>' + esc(c.text) + '</p></div>';
  }).join("");
  document.getElementById("cmt-list").innerHTML = seedHtml + list.map(function(c, i){
    var own = isMyComment(c);
    return '<div class="cmt-item" id="cmt-' + i + '">' +
      '<div style="display:flex;align-items:center">' +
        '<span class="who">' + esc(c.author) + '</span>' +
        '<span class="when">' + esc(c.date) + (c.edited ? ' (수정됨)' : '') + '</span>' +
        (own ? '<div class="own-actions">' +
          '<button class="mini-btn" onclick="startEditCmt(' + i + ')">수정</button>' +
          '<button class="mini-btn danger-btn" onclick="removeCmt(' + i + ')">삭제</button></div>' : '') +
      '</div>' +
      '<p id="cmt-text-' + i + '">' + esc(c.text) + '</p></div>';
  }).join("") + dbCmtHtml();

  var u = currentUser();
  document.getElementById("cmt-input").innerHTML = u
    ? '<div class="cmt-form"><input type="text" id="cmt-text" placeholder="' + esc(u.nick) + '님, 따뜻한 댓글을 남겨주세요" maxlength="300"><button class="btn primary" onclick="addComment()">등록</button></div>'
    : '<div class="cmt-login">댓글을 쓰려면 <a href="login.html?next=' + encodeURIComponent("view.html?id=" + id) + '">로그인</a>이 필요해요.</div>';

  var inp = document.getElementById("cmt-text");
  if (inp) inp.addEventListener("keydown", function(e){ if(e.key === "Enter") addComment(); });
}

function closeJob(){
  var closing = post.head !== "채용완료";
  if (!confirm(closing ? "이 공고를 채용완료로 바꿀까요?\n목록에 '채용완료'로 표시돼요." : "채용완료를 취소하고 다시 모집할까요?")) return;
  var p = toggleJobClosed(post.id);
  if (p && typeof p.then === "function") p.then(function(){ location.reload(); }, function(e){ alert("바꾸지 못했어요: " + (e.message || e)); });
  else if (p) location.reload();
}
function editPost(){ location.href = "write.html?edit=" + post.id; }
function removePost(){
  if (!confirm("이 글을 삭제할까요?\n삭제하면 되돌릴 수 없습니다.")) return;
  if (post.db) {
    JIDB.deletePost(post.id).then(function(){ alert("글이 삭제되었습니다."); location.href = TRADE_PAGE[post.board] || "community.html"; },
      function(e){ alert("삭제하지 못했어요: " + (e.message || e)); });
    return;
  }
  if (deleteMyPost(post.id)) {
    alert("글이 삭제되었습니다.");
    location.href = TRADE_PAGE[post.board] ||
      (post.board ? "community.html?board=" + encodeURIComponent(post.board) : "community.html");
  }
}

function startEditCmt(i){
  var all = JI.get("comments", {});
  var c = (all[id] || [])[i];
  if (!c) return;
  var box = document.getElementById("cmt-text-" + i);
  box.outerHTML = '<div class="edit-box" id="cmt-text-' + i + '">' +
    '<input type="text" id="cmt-edit-' + i + '" maxlength="300">' +
    '<button class="btn primary" onclick="saveCmt(' + i + ')">저장</button>' +
    '<button class="btn ghost" onclick="renderComments()">취소</button></div>';
  var inp = document.getElementById("cmt-edit-" + i);
  inp.value = c.text;
  inp.focus();
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") saveCmt(i); });
}
function saveCmt(i){
  var t = document.getElementById("cmt-edit-" + i).value.trim();
  if (!t) { alert("댓글 내용을 입력해주세요."); return; }
  if (updateMyComment(id, i, t)) renderComments();
}
function removeCmt(i){
  if (!confirm("이 댓글을 삭제할까요?")) return;
  if (deleteMyComment(id, i)) renderComments();
}

function addComment() {
  var u = currentUser();
  if (!u) return;
  var inp = document.getElementById("cmt-text");
  var text = inp.value.trim();
  if (!text) { alert("댓글 내용을 입력해주세요."); return; }
  if (window.JIDB && JIDB.enabled) {
    if (!u.id) { alert("다시 로그인해 주세요."); return; }
    inp.disabled = true;
    JIDB.addComment(id, text).then(function (c) { DB_CMTS.push(c); renderComments(); },
      function (e) { inp.disabled = false; alert("댓글을 등록하지 못했어요: " + (e.message || e)); });
    return;
  }
  var all = JI.get("comments", {});
  if (!all[id]) all[id] = [];
  all[id].push({
    author: u.nick, text: text,
    date: new Date().toISOString().slice(0,10),
    postTitle: post ? post.title : "",
    postId: id
  });
  JI.set("comments", all);
  renderComments();
}
</script>
