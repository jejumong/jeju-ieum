<script>
(function(){
  function esc(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
  /* 목적별 세 묶음: 일자리 / 사고팔기 / 함께하기 */
  var BOARDS = [
    ["구인구직", "jobs.html", "💼", "구인·알바·단기·재택, 일을 찾는 이웃의 구직 글까지", "job"],
    ["중고사고팔기", "market.html", "📦", "동네 직거래"],
    ["제주상점", "shops.html", "🏪", "이웃이 검증한 가게"],
    ["특가공구", "deals.html", "🍊", "함께 사면 더 싸게"],
    ["동호회", "clubs.html", "🏄", "취미로 만나는 이웃"],
    ["축제정보", "festivals.html", "🎉", "지금 열리는 행사"]
  ];
  var GROUPS = [
    ["💼", "일자리", "제주에서 일할 사람, 일할 곳을 찾아요", ["구인구직"]],
    ["📦", "사고팔기", "필요한 물건과 믿을 만한 가게", ["중고사고팔기", "제주상점", "특가공구"]],
    ["🏄", "함께하기", "취미 모임과 지금 열리는 행사", ["동호회", "축제정보"]]
  ];
  var posts = allPosts();
  function shortPrice(p){
    var v = (p.price || "").toString().replace(/[^0-9]/g, "");
    if (!v) return "";
    var n = +v;
    if (n >= 100000000) return (Math.round(n/10000000)/10) + "억";
    if (n >= 10000) return Math.round(n/10000).toLocaleString() + "만";
    return n.toLocaleString();
  }
  function boxHtml(b){
    var list = b[0] === "축제정보"
      ? activeFestivals().sort(function(a, c){ var o = { "진행중":0, "예정":1, "마감":2 }; return ((o[a.head] ?? 3) - (o[c.head] ?? 3)) || ((a.start || "") < (c.start || "") ? -1 : 1); })   // 끝난 지 7일 지난 축제는 빼고, 진행중·예정 먼저
      : premiumFirst(posts.filter(function(p){ return p.board === b[0]; }).sort(byRecent));
    var items = list.slice(0, b[4] === "job" ? 6 : 5).map(function(p){
      var pr = shortPrice(p);
      return '<li>' + (isPremium(p) ? '<span class="chip new">AD</span>' : (p.loc ? '<span class="chip region">' + esc(String(p.loc).split(" ")[0]) + '</span>' : '')) +
        '<a href="view.html?id=' + p.id + '">' + esc(p.title) + '</a>' + (pr ? '<span class="price">' + pr + '</span>' : '<span class="meta">' + (b[0] === "축제정보" && p.period ? esc(p.period) : fmtDate(p.date)) + '</span>') + '</li>';
    }).join("");
    return '<section class="card hub-box' + (b[4] ? " " + b[4] : "") + '" data-href="' + b[1] + '"><a class="card-head hub-go" href="' + b[1] + '"><h2><span class="ti">' + b[2] + '</span>' + b[0] + ' <span class="tc">' + list.length + '</span></h2>' +
      '<span class="hub-arrow" aria-hidden="true">›</span></a>' +
      '<p style="font-size:13px;color:var(--ink-4);margin:-4px 0 6px">' + b[3] + '</p>' +
      '<ul>' + (items || '<li style="color:var(--ink-4)">아직 글이 없어요 · <a href="' + writeHref(b[0]) + '" style="color:var(--sea-700);font-weight:700">첫 글 올리기 →</a></li>') + '</ul></section>';
  }
  var hub = document.getElementById("hub");
  hub.innerHTML = GROUPS.map(function(g, gi){
    var boxes = g[3].map(function(name){ return boxHtml(BOARDS.filter(function(b){ return b[0] === name; })[0]); }).join("");
    if (gi === 0) boxes += '<aside class="card job-side"><h3>공공 일자리도 함께 보세요</h3>' +
      '<a href="https://www.work24.go.kr" target="_blank" rel="noopener"><b>고용24</b><span>정부 공식 구인·구직 · 지역에서 \'제주\'를 고르면 돼요</span></a>' +
      '<a class="btn accent block" href="write.html?board=' + encodeURIComponent("구인구직") + '">✏️ 공고·구직 글 올리기</a></aside>';
    return '<section class="hub-group' + (gi === 0 ? ' job' : '') + '"><div class="hub-gh"><span class="hub-gi">' + g[0] + '</span><div><h2>' + g[1] + '</h2><p>' + g[2] + '</p></div></div>' +
      '<div class="board-grid trade-hub' + (gi === 0 ? ' job-grid' : '') + '">' + boxes + (gi === 1 ? '' : '') + '</div></section>';
  }).join("");
  hub.querySelectorAll(".trade-hub")[1].appendChild(document.querySelector(".biz-strip")); // 사고팔기 묶음에 입점 안내 (2×2)
  // 상자 아무 곳이나 누르면 그 게시판으로 (글 제목·버튼을 누르면 그 글로)
  hub.addEventListener("click", function(e){
    if (e.target.closest("a,button")) return;
    var box = e.target.closest(".hub-box");
    if (box) location.href = box.getAttribute("data-href");
  });
})();
window.onJIData = function(){ location.reload(); };   // 새 글이 생기면 한 번 새로 그림
</script>
</body>
</html>
