<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 권한 문의 — 제주이음</title>
<!--og--><meta property="og:type" content="website"><meta property="og:site_name" content="제주이음"><meta property="og:title" content="글쓰기 권한 문의 — 제주이음"><meta property="og:description" content="제주에 살고 있거나 살아보려는 사람들을 위한 생활 정보와 동네 커뮤니티. 가이드·한달살기·학교 연계 집·부동산·오일장 달력."><meta property="og:url" content="https://jejuieum.com/seller-request.html"><meta property="og:image" content="https://jejuieum.com/assets/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="ko_KR"><meta name="twitter:card" content="summary_large_image"><!--/og-->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261109m">
<style>
.req-status{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r);margin-bottom:20px;font-size:14px}
.req-status.pending{background:var(--sea-50);border:1px solid var(--sea-100);color:var(--sea-700)}
.req-status.approved{background:#e9f9f1;border:1px solid #c7ecd9;color:var(--moss)}
.req-status.rejected{background:var(--coral-50);border:1px solid #f7d4d1;color:var(--coral)}
.req-status .ico{font-size:20px}
.req-status .rt{font-weight:800}
.req-status .rs{font-size:12.5px;opacity:.85;margin-top:2px}
.sr-sec{border-top:1px solid var(--line-2);padding-top:18px;margin-top:18px}
.sr-sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.sr-sec h3{font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:12px}
.sr-sec label small{font-weight:500;color:var(--ink-4)}
.sr-done{background:var(--bg-2);border-radius:var(--r);padding:14px 16px;margin-top:4px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.sr-done b{color:var(--ink)}
</style>
</head>
<body data-active="">

<div class="page-head"><div class="inner">
  <div>
    <div class="crumb"><a href="index.html">홈</a> › <span id="crumb">글쓰기 권한 문의</span></div>
    <h1 id="h1">글쓰기 권한 문의</h1>
    <p id="sub">관리자 승인을 받으면 이 게시판에 글을 쓸 수 있어요</p>
  </div>
</div></div>

<main class="wrap">
  <div class="form-card" style="max-width:720px">
    <div id="status-box"></div>

    <div id="form-box">
      <h2 style="font-size:18px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;color:var(--ink)">🔒 <span id="board-name"></span> 글쓰기는 승인제입니다</h2>
      <p style="font-size:13.5px;color:var(--ink-3);margin-bottom:22px;line-height:1.6" id="board-desc"></p>

      <div class="sr-sec">
        <h3>1. 가게·판매자 정보</h3>
        <div class="field-row">
          <div class="field"><label for="f-name">상호명 <span class="req">*</span></label><input id="f-name" maxlength="40" placeholder="예: 세화 귤빛농장"></div>
          <div class="field"><label for="f-owner">대표자 이름 <span class="req">*</span></label><input id="f-owner" maxlength="20" placeholder="실명"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-cat">업종 <span class="req">*</span></label>
            <select id="f-cat"><option value="">선택하세요</option><option>농수산물·특산품</option><option>음식점·카페</option><option>숙박</option><option>공방·체험</option><option>생활 서비스 (이사·청소·인테리어)</option><option>기타</option></select></div>
          <div class="field"><label for="f-biz">사업자등록번호 <small>(없으면 비워 두세요)</small></label><input id="f-biz" maxlength="12" inputmode="numeric" placeholder="000-00-00000"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-tel">연락처 <span class="req">*</span></label><input id="f-tel" maxlength="20" inputmode="tel" placeholder="010-0000-0000 (관리자만 봐요)"></div>
          <div class="field"><label for="f-addr">가게·농장 위치 <span class="req">*</span></label><input id="f-addr" maxlength="80" placeholder="예: 제주시 구좌읍 세화리"></div>
        </div>
      </div>

      <div class="sr-sec" id="sec-deal">
        <h3>2. 공동구매 계획</h3>
        <div class="field"><label for="d-item">공구할 상품 <span class="req">*</span></label><input id="d-item" maxlength="60" placeholder="예: 구좌 흙당근 5kg (못난이 포함)"></div>
        <div class="field-row">
          <div class="field"><label for="d-price">평소 가격 / 공구 가격</label><input id="d-price" maxlength="40" placeholder="예: 25,000원 → 18,000원"></div>
          <div class="field"><label for="d-goal">최소 · 목표 인원</label><input id="d-goal" maxlength="40" placeholder="예: 최소 20명 · 목표 50명"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="d-when">진행 희망 시기</label><input id="d-when" maxlength="40" placeholder="예: 12월 첫째 주, 1주일간"></div>
          <div class="field"><label for="d-ship">받는 방법</label>
            <select id="d-ship"><option>택배 배송</option><option>직접 수령 (픽업)</option><option>택배·픽업 둘 다</option></select></div>
        </div>
      </div>

      <div class="sr-sec" id="sec-shop">
        <h3>2. 가게 정보</h3>
        <div class="field-row">
          <div class="field"><label for="s-hours">영업 시간</label><input id="s-hours" maxlength="60" placeholder="예: 10:00~18:00, 화요일 휴무"></div>
          <div class="field"><label for="s-park">주차</label><select id="s-park"><option>주차 가능</option><option>주변 공영주차장</option><option>주차 어려움</option></select></div>
        </div>
        <div class="field"><label for="s-menu">대표 메뉴·서비스 <span class="req">*</span></label><input id="s-menu" maxlength="100" placeholder="예: 보말칼국수 12,000원 · 전복죽 15,000원"></div>
        <div class="field"><label for="s-benefit">제주이음 이웃 혜택 <small>(선택)</small></label><input id="s-benefit" maxlength="80" placeholder="예: 제주이음 보고 왔다고 하면 음료 1잔 서비스"></div>
      </div>

      <div class="sr-sec">
        <h3>3. 더 하고 싶은 말</h3>
        <div class="field"><textarea id="msg" style="min-height:110px" maxlength="1000" placeholder="관리자에게 전하고 싶은 내용을 자유롭게 적어 주세요. (선택)"></textarea></div>
        <div class="check-line"><input type="checkbox" id="agree"><label for="agree">[필수] 입력한 정보를 승인 검토에 쓰는 데 동의합니다. 연락처와 사업자 정보는 관리자만 봐요.</label></div>
      </div>

      <div class="form-actions">
        <a class="btn ghost" href="javascript:history.back()">취소</a>
        <button class="btn primary" id="sr-send" onclick="submitRequest()">승인 요청 보내기</button>
      </div>
    </div>
  </div>
</main>

<script src="assets/common.js?v=20261109m"></script>
<script src="assets/db.js?v=20261109m"></script>
<script src="assets/notify.js?v=20261109m"></script>
<script src="assets/admin-data.js?v=20261109m"></script>
<script>
var user = currentUser();
var board = new URLSearchParams(location.search).get("board") || "특가공구";
var BOARD_INFO = {
  "특가공구": { icon:"⚡", label:"공구문의하기", desc:"공동구매 글은 가격 오류나 배송 사고를 막기 위해 관리자 확인 후에만 올릴 수 있어요. 어떤 상품을, 어떤 조건으로 공구하고 싶은지 알려주세요." },
  "제주상점": { icon:"🏬", label:"상점 등록 문의", desc:"제주상점은 실제 운영 중인 가게만 등록할 수 있도록 관리자가 확인하고 있어요. 가게 이름과 위치, 업종을 알려주시면 빠르게 검토해드립니다." }
};
var info = BOARD_INFO[board] || { icon:"🔒", label:"글쓰기 권한 문의", desc:"이 게시판은 관리자 승인 후 글을 쓸 수 있어요." };

document.getElementById("board-name").textContent = board;
document.getElementById("h1").textContent = info.label;
document.getElementById("crumb").textContent = info.label;
document.getElementById("sub").textContent = board + " 게시판에 글을 쓰려면 관리자 승인이 필요해요";
document.getElementById("board-desc").textContent = info.desc;
document.title = info.label + " — 제주이음";

if (!user) {
  if (confirm("문의는 로그인 후 이용할 수 있어요.\\n로그인 페이지로 이동할까요?")) {
    location.href = "login.html?next=" + encodeURIComponent("seller-request.html?board=" + encodeURIComponent(board));
  } else {
    location.href = "index.html";
  }
}

/* 이미 승인됐거나, 요청을 보낸 적 있으면 상태를 보여줌 */
(function render(){
  if (!user) return;
  if (isApprovedSeller(board)) {
    document.getElementById("status-box").innerHTML =
      '<div class="req-status approved"><span class="ico">✅</span><div><div class="rt">이미 승인된 회원입니다</div>' +
      '<div class="rs">바로 글을 작성할 수 있어요.</div></div></div>';
    document.getElementById("form-box").style.display = "none";
    var go = document.createElement("a");
    go.className = "btn primary block"; go.href = "write.html?board=" + encodeURIComponent(board);
    go.textContent = "✏️ " + board + " 글쓰기";
    document.querySelector(".form-card").appendChild(go);
    return;
  }
  var req = mySellerRequest(board);
  if (req && req.status === "pending") {
    document.getElementById("status-box").innerHTML =
      '<div class="req-status pending"><span class="ico">⏳</span><div><div class="rt">승인 대기중</div>' +
      '<div class="rs">' + req.date + '에 보낸 요청을 관리자가 확인하고 있어요.</div></div></div>';
    document.getElementById("form-box").style.display = "none";
  } else if (req && req.status === "rejected") {
    document.getElementById("status-box").innerHTML =
      '<div class="req-status rejected"><span class="ico">✕</span><div><div class="rt">이전 요청이 반려되었습니다</div>' +
      '<div class="rs">내용을 보완해서 다시 요청해보세요.</div></div></div>';
  }
})();

document.getElementById("sec-deal").style.display = board === "특가공구" ? "block" : "none";
document.getElementById("sec-shop").style.display = board === "특가공구" ? "none" : "block";

function v(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }
function submitRequest(){
  var need = [["f-name","상호명"],["f-owner","대표자 이름"],["f-cat","업종"],["f-tel","연락처"],["f-addr","가게·농장 위치"]]
    .concat(board === "특가공구" ? [["d-item","공구할 상품"]] : [["s-menu","대표 메뉴·서비스"]]);
  for (var i = 0; i < need.length; i++) if (!v(need[i][0])) { alert(need[i][1] + "을(를) 입력해 주세요."); document.getElementById(need[i][0]).focus(); return; }
  if (!/^[0-9\-\s]{9,}$/.test(v("f-tel"))) { alert("연락처를 숫자로 정확히 적어 주세요."); document.getElementById("f-tel").focus(); return; }
  if (!document.getElementById("agree").checked) { alert("정보 이용에 동의해 주세요."); return; }
  var d = { 상호명: v("f-name"), 대표자: v("f-owner"), 업종: v("f-cat"), 사업자등록번호: v("f-biz"), 연락처: v("f-tel"), 위치: v("f-addr") };
  if (board === "특가공구") { d.공구상품 = v("d-item"); d.가격 = v("d-price"); d.인원 = v("d-goal"); d.시기 = v("d-when"); d.받는방법 = v("d-ship"); }
  else { d.영업시간 = v("s-hours"); d.주차 = v("s-park"); d.대표메뉴 = v("s-menu"); d.이웃혜택 = v("s-benefit"); }
  var text = Object.keys(d).filter(function(k){ return d[k]; }).map(function(k){ return k + ": " + d[k]; }).join("\n") + (v("msg") ? "\n\n" + v("msg") : "");
  var btn = document.getElementById("sr-send"); btn.disabled = true; btn.textContent = "보내는 중…";
  var done = function(){
    sendSellerRequest(board, text, d);
    alert("승인 요청을 보냈어요. 관리자가 확인한 뒤 연락드리거나 이 게시판 글쓰기를 열어 드려요.");
    location.reload();
  };
  if (window.JIDB && JIDB.enabled && user && user.id) {
    JIDB.sendSellerRequest(board, d, v("msg")).then(done, function(e){
      btn.disabled = false; btn.textContent = "승인 요청 보내기";
      alert("요청을 보내지 못했어요: " + (e.message || e) + "\n잠시 후 다시 시도해 주세요.");
    });
  } else done();
}
</script>
</body>
</html>
