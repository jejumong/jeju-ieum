<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 권한 문의 — 제주이음</title>
<!--og--><meta property="og:type" content="website"><meta property="og:site_name" content="제주이음"><meta property="og:title" content="글쓰기 권한 문의 — 제주이음"><meta property="og:description" content="제주에 살고 있거나 살아보려는 사람들을 위한 생활 정보와 동네 커뮤니티. 가이드·한달살기·학교 연계 집·부동산·오일장 달력."><meta property="og:url" content="https://jejuieum.com/seller-request.html"><meta property="og:image" content="https://jejuieum.com/assets/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="ko_KR"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://jejuieum.com/seller-request.html"><!--/og-->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261111m">
<style>
.req-status{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r);margin-bottom:20px;font-size:14px}
.req-status.pending{background:var(--sea-50);border:1px solid var(--sea-100);color:var(--sea-700)}
.req-status.approved{background:#e9f9f1;border:1px solid #c7ecd9;color:var(--moss)}
.req-status.rejected{background:var(--coral-50);border:1px solid #f7d4d1;color:var(--coral)}
.req-status .ico{font-size:20px}
.req-status .rt{font-weight:800}
.req-status .rs{font-size:12.5px;opacity:.85;margin-top:2px}
.sr-sec{border-top:1px solid var(--line-2);padding-top:18px;margin-top:18px}
.sr-sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.sr-sec h3{font-size:15.5px;font-weight:800;color:var(--ink);margin-bottom:12px}
.sr-sec label small{font-weight:500;color:var(--ink-4)}
.sr-done{background:var(--bg-2);border-radius:var(--r);padding:14px 16px;margin-top:4px;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.sr-done b{color:var(--ink)}
</style>
</head>
<body data-active="">

<div class="page-head"><div class="inner">
  <div>
    <div class="crumb"><a href="index.html">홈</a> › <span id="crumb">글쓰기 권한 문의</span></div>
    <h1 id="h1">글쓰기 권한 문의</h1>
    <p id="sub">관리자 승인을 받으면 이 게시판에 글을 쓸 수 있어요</p>
  </div>
</div></div>

<main class="wrap">
  <div class="form-card" style="max-width:720px">
    <div id="status-box"></div>

    <div id="form-box">
      <h2 style="font-size:18px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;color:var(--ink)">🔒 <span id="board-name"></span> 글쓰기는 승인제입니다</h2>
      <p style="font-size:13.5px;color:var(--ink-3);margin-bottom:22px;line-height:1.6" id="board-desc"></p>

      <div class="sr-sec">
        <h3>1. 간단한 가게 소개</h3>
        <div class="field-row">
          <div class="field"><label for="f-name">상호명 <span class="req">*</span></label><input id="f-name" maxlength="40" placeholder="예: 세화 귤빛농장"></div>
          <div class="field"><label for="f-cat">업종 <span class="req">*</span></label>
            <select id="f-cat"><option value="">선택하세요</option><option>맛집·카페</option><option>생활·수리</option><option>건강·의료</option><option>교육·학원</option><option>농수산 직판</option><option>숙박·체험</option><option>기타</option></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f-tel">연락처 <span class="req">*</span></label><input id="f-tel" maxlength="20" inputmode="tel" placeholder="010-0000-0000 (관리자만 봐요)"></div>
          <div class="field"><label for="f-addr">가게·농장 위치 <span class="req">*</span></label>
            <div style="display:flex;gap:8px"><input id="f-addr" maxlength="100" placeholder="주소 찾기를 눌러 주세요" style="flex:1;min-width:0">
              <button type="button" class="btn ghost" id="addr-find" style="flex:none">주소 찾기</button></div></div>
        </div>
        <div class="field" style="margin-top:-4px"><input id="f-addr2" maxlength="60" placeholder="상세 주소 (선택) — 예: 2층, ○○농장 입구"></div>
        <div id="addr-map" style="margin:4px 0 8px"></div>
        <div class="field"><label for="f-intro">어떤 가게인가요? <span class="req">*</span></label><textarea id="f-intro" style="min-height:90px" maxlength="600" placeholder="예: 세화리에서 10년째 노지 감귤을 키우는 농장이에요. 제주이음 이웃에게 직거래로 팔고 싶어요."></textarea></div>
        <div class="field"><label>가게·농장 사진 <small>(선택 · 최대 6장 — 가게 전경, 대표 상품 등)</small></label>
          <input type="file" id="ph-input" accept="image/jpeg,image/png,image/webp,image/heic,image/*" multiple hidden>
          <div class="ph-grid" id="ph-grid"></div>
          <div class="file-drop" id="ph-drop" role="button" tabindex="0">📷 눌러서 사진 올리기</div>
          <div class="hint" id="ph-note"></div></div>
      </div>

      <div class="sr-sec" id="sec-deal">
        <h3>2. 공동구매 계획</h3>
        <div class="field"><label for="d-item">공구할 상품 <span class="req">*</span></label><input id="d-item" maxlength="60" placeholder="예: 구좌 흙당근 5kg (못난이 포함)"></div>
        <div class="field-row">
          <div class="field"><label for="d-price">평소 가격 / 공구 가격</label><input id="d-price" maxlength="40" placeholder="예: 25,000원 → 18,000원"></div>
          <div class="field"><label for="d-goal">최소 · 목표 인원</label><input id="d-goal" maxlength="40" placeholder="예: 최소 20명 · 목표 50명"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="d-when">진행 희망 시기</label><input id="d-when" maxlength="40" placeholder="예: 12월 첫째 주, 1주일간"></div>
          <div class="field"><label for="d-ship">받는 방법</label>
            <select id="d-ship"><option>택배 배송</option><option>직접 수령 (픽업)</option><option>택배·픽업 둘 다</option></select></div>
        </div>
      </div>

      <div class="sr-sec">
        <h3 id="h-last">3. 더 하고 싶은 말</h3>
        <div class="field"><textarea id="msg" style="min-height:110px" maxlength="1000" placeholder="관리자에게 전하고 싶은 내용을 자유롭게 적어 주세요. (선택)"></textarea></div>
        <div class="check-line"><input type="checkbox" id="agree"><label for="agree">[필수] 입력한 정보를 승인 검토에 쓰는 데 동의합니다. 연락처는 관리자만 봐요.</label></div>
      </div>

      <div class="form-actions">
        <a class="btn ghost" href="javascript:history.back()">취소</a>
        <button class="btn primary" id="sr-send" onclick="submitRequest()">승인 요청 보내기</button>
      </div>
    </div>
  </div>
</main>

<script src="assets/common.js?v=20261111m"></script>
<script src="assets/db.js?v=20261111m"></script>
<script src="assets/notify.js?v=20261111m"></script>
<script src="assets/admin-data.js?v=20261111m"></script>
<script src="assets/kmap.js?v=20261111m"></script>
<script>
var user = currentUser();
var board = new URLSearchParams(location.search).get("board") || "특가공구";
var BOARD_INFO = {
  "특가공구": { icon:"⚡", label:"공구문의하기", desc:"공동구매 글은 가격 오류나 배송 사고를 막기 위해 관리자 확인 후에만 올릴 수 있어요. 어떤 상품을, 어떤 조건으로 공구하고 싶은지 알려주세요." },
  "제주상점": { icon:"🏬", label:"상점 등록 문의", desc:"실제 운영 중인 가게인지 확인한 뒤 승인해 드려요. 간단히 소개만 남겨 주세요. 승인되면 상점판매자가 되고, 영업시간·메뉴·사진을 담은 상점 글을 직접 올릴 수 있어요." }
};
var info = BOARD_INFO[board] || { icon:"🔒", label:"글쓰기 권한 문의", desc:"이 게시판은 관리자 승인 후 글을 쓸 수 있어요." };

document.getElementById("board-name").textContent = board;
document.getElementById("h1").textContent = info.label;
document.getElementById("crumb").textContent = info.label;
document.getElementById("sub").textContent = board + " 게시판에 글을 쓰려면 관리자 승인이 필요해요";
document.getElementById("board-desc").textContent = info.desc;
document.title = info.label + " — 제주이음";

if (!user) {
  if (confirm("문의는 로그인 후 이용할 수 있어요.\\n로그인 페이지로 이동할까요?")) {
    location.href = "login.html?next=" + encodeURIComponent("seller-request.html?board=" + encodeURIComponent(board));
  } else {
    location.href = "index.html";
  }
}

/* 이미 승인됐거나, 요청을 보낸 적 있으면 상태를 보여줌 */
(function render(){
  if (!user) return;
  if (isApprovedSeller(board)) {
    document.getElementById("status-box").innerHTML =
      '<div class="req-status approved"><span class="ico">✅</span><div><div class="rt">이미 승인된 회원입니다</div>' +
      '<div class="rs">바로 글을 작성할 수 있어요.</div></div></div>';
    document.getElementById("form-box").style.display = "none";
    var go = document.createElement("a");
    go.className = "btn primary block"; go.href = "write.html?board=" + encodeURIComponent(board);
    go.textContent = "✏️ " + board + " 글쓰기";
    document.querySelector(".form-card").appendChild(go);
    return;
  }
  // 서버가 있으면 서버의 최신 상태로 (반려·승인이 바로 반영되게), 없으면 이 브라우저 기록
  if (window.JIDB && JIDB.enabled && user.id) {
    JIDB.ready.then(function () { return JIDB.call("seller_my", { board: board }); }).then(showReq, function () { showReq(mySellerRequest(board)); });
  } else showReq(mySellerRequest(board));
})();
function showReq(req){
  document.getElementById("status-box").innerHTML = ""; document.getElementById("form-box").style.display = "";
  if (req && req.status === "approved") {   // 승인됐는데 이 화면의 회원 정보가 옛것인 경우
    if (!sessionStorage.getItem("sr_reload")) { sessionStorage.setItem("sr_reload", "1"); location.reload(); return; }
    document.getElementById("status-box").innerHTML = '<div class="req-status approved"><span class="ico">✅</span><div><div class="rt">승인되었어요</div><div class="rs">로그아웃 후 다시 로그인하면 ' + board + ' 글쓰기가 열려요.</div></div></div>';
    document.getElementById("form-box").style.display = "none"; return;
  }
  if (req && req.status === "pending") {
    document.getElementById("status-box").innerHTML =
      '<div class="req-status pending"><span class="ico">⏳</span><div><div class="rt">승인 대기중</div>' +
      '<div class="rs">' + req.date + '에 보낸 요청을 관리자가 확인하고 있어요.</div></div></div>';
    document.getElementById("form-box").style.display = "none";
  } else if (req && req.status === "rejected") {
    document.getElementById("status-box").innerHTML =
      '<div class="req-status rejected"><span class="ico">✕</span><div><div class="rt">이전 요청이 반려되었습니다</div>' +
      '<div class="rs">내용을 보완해서 아래 양식으로 다시 요청할 수 있어요.</div></div></div>';
  }
}

document.getElementById("sec-deal").style.display = board === "특가공구" ? "block" : "none";
document.getElementById("h-last").textContent = board === "특가공구" ? "3. 더 하고 싶은 말" : "2. 더 하고 싶은 말";

function v(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }

/* 위치: 주소 찾기(다음 우편번호) → 카카오맵 좌표 → 지도 미리보기 */
var POS = null;
function setAddr(addr){
  document.getElementById("f-addr").value = addr; POS = null;
  JIMap.load().then(function(ok){ return ok ? JIMap.find(addr) : null; }).then(function(p){ if (p) POS = { lat: p.lat, lng: p.lng }; });
  JIMap.show(document.getElementById("addr-map"), addr);
}
document.getElementById("addr-find").onclick = function(){
  function open(){ new daum.Postcode({ oncomplete: function(d){ setAddr(d.roadAddress || d.jibunAddress || d.address); if (!v("f-name") && d.buildingName) document.getElementById("f-name").value = d.buildingName; document.getElementById("f-addr2").focus(); } }).open(); }
  if (window.daum && daum.Postcode) return open();
  var sc = document.createElement("script"); sc.src = "https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js";
  sc.onload = open; sc.onerror = function(){ alert("주소 찾기를 불러오지 못했어요. 주소를 직접 적어 주세요."); }; document.head.appendChild(sc);
};
document.getElementById("f-addr").addEventListener("change", function(){ if (this.value.trim()) setAddr(this.value.trim()); });

/* 사진 (최대 6장) */
var PHOTOS = [], PH_BUSY = 0, PH_MAX = 6;
function drawPhotos(){
  document.getElementById("ph-grid").innerHTML = PHOTOS.map(function(p, i){
    return '<div class="ph-item' + (p.url ? '' : ' up') + '"><img src="' + (p.url || p.preview) + '" alt="">' + (p.url ? '' : '<span class="ph-load">올리는 중…</span>') +
      '<div class="ph-acts"><button type="button" class="ph-del" onclick="PHOTOS.splice(' + i + ',1);drawPhotos()" title="빼기">✕</button></div></div>';
  }).join("");
  document.getElementById("ph-drop").style.display = PHOTOS.length >= PH_MAX ? "none" : "";
  document.getElementById("ph-note").textContent = PHOTOS.length ? PHOTOS.length + " / " + PH_MAX + "장" + (PH_BUSY ? " · 올리는 중이에요" : "") : "";
}
function addPhotos(files){
  if (!(window.JIDB && JIDB.enabled) || !(user && user.id)) { alert("로그인 후 사진을 올릴 수 있어요."); return; }
  [].slice.call(files, 0, PH_MAX - PHOTOS.length).forEach(function(f){
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic)$/i.test(f.name)) { alert(f.name + " 은(는) 사진 파일이 아니에요."); return; }
    var it = { preview: URL.createObjectURL(f), url: "" }; PHOTOS.push(it); PH_BUSY++;
    JIDB.shrinkImage(f, 1600, 0.82).then(function(b){ return JIDB.uploadPhoto(b, "photo.jpg"); }).then(function(r){ it.url = r.url; PH_BUSY--; drawPhotos(); },
      function(e){ PH_BUSY--; var k = PHOTOS.indexOf(it); if (k > -1) PHOTOS.splice(k, 1); drawPhotos(); alert("사진을 올리지 못했어요: " + (e.message || e)); });
  });
  drawPhotos();
}
(function(){
  var inp = document.getElementById("ph-input"), drop = document.getElementById("ph-drop");
  drop.onclick = function(){ inp.click(); };
  inp.onchange = function(){ if (this.files.length) addPhotos(this.files); this.value = ""; };
  ["dragover", "dragenter"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add("on"); }); });
  ["dragleave", "drop"].forEach(function(t){ drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove("on"); }); });
  drop.addEventListener("drop", function(e){ if (e.dataTransfer.files.length) addPhotos(e.dataTransfer.files); });
})();
function submitRequest(){
  var need = [["f-name","상호명"],["f-cat","업종"],["f-tel","연락처"],["f-addr","가게·농장 위치"],["f-intro","가게 소개"]]
    .concat(board === "특가공구" ? [["d-item","공구할 상품"]] : []);
  for (var i = 0; i < need.length; i++) if (!v(need[i][0])) { alert(need[i][1] + "을(를) 입력해 주세요."); document.getElementById(need[i][0]).focus(); return; }
  if (!/^[0-9\-\s]{9,}$/.test(v("f-tel"))) { alert("연락처를 숫자로 정확히 적어 주세요."); document.getElementById("f-tel").focus(); return; }
  if (!document.getElementById("agree").checked) { alert("정보 이용에 동의해 주세요."); return; }
  if (PH_BUSY) { alert("사진을 올리는 중이에요. 다 올라간 뒤 보내 주세요."); return; }
  var d = { 상호명: v("f-name"), 업종: v("f-cat"), 연락처: v("f-tel"), 위치: v("f-addr") + (v("f-addr2") ? " " + v("f-addr2") : ""), 소개: v("f-intro") };
  if (board === "특가공구") { d.공구상품 = v("d-item"); d.가격 = v("d-price"); d.인원 = v("d-goal"); d.시기 = v("d-when"); d.받는방법 = v("d-ship"); }
  var extra = { photos: PHOTOS.filter(function(p){ return p.url; }).map(function(p){ return p.url; }), lat: POS ? POS.lat : "", lng: POS ? POS.lng : "", addr: v("f-addr") };
  var text = Object.keys(d).filter(function(k){ return d[k]; }).map(function(k){ return k + ": " + d[k]; }).join("\n") + (v("msg") ? "\n\n" + v("msg") : "");
  var btn = document.getElementById("sr-send"); btn.disabled = true; btn.textContent = "보내는 중…";
  var done = function(){
    sendSellerRequest(board, text, d);
    alert("승인 요청을 보냈어요. 관리자가 확인한 뒤 연락드리거나 이 게시판 글쓰기를 열어 드려요.");
    location.reload();
  };
  if (window.JIDB && JIDB.enabled && user && user.id) {
    JIDB.sendSellerRequest(board, Object.assign({}, d, { _photos: extra.photos, _lat: extra.lat, _lng: extra.lng, _addr: extra.addr }), v("msg")).then(done, function(e){
      btn.disabled = false; btn.textContent = "승인 요청 보내기";
      alert("요청을 보내지 못했어요: " + (e.message || e) + "\n잠시 후 다시 시도해 주세요.");
    });
  } else done();
}
</script>
</body>
</html>
