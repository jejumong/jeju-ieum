      <span class="shf-n" id="re-count"><b id="shown-count">0</b>건의 매물</span>
      <div class="shf-r"><span class="ref-l">거래 방식</span>

          <button type="button" class="on" data-filter="all" onclick="applyChip(this)">전체</button>
          <button type="button" data-filter="매매" onclick="applyChip(this)">매매</button>
          <button type="button" data-filter="연세" onclick="applyChip(this)">연세</button>
          <button type="button" data-filter="월세" onclick="applyChip(this)">월세</button>
          <button type="button" data-filter="단기" onclick="applyChip(this)">단기·한달</button>

        <div class="seg" id="who-bar" role="group" aria-label="올린 사람">
          <button type="button" class="on" data-who="all" onclick="applyWho(this)">전체</button>
          <button type="button" data-who="realtor" onclick="applyWho(this)">🏢 중개사</button>

<script>


var EMOJI = { "tr1":"🏡","tr2":"🏢","tr3":"🏙️","tr4":"🌊","tr5":"🏠","tr6":"🌙","tr7":"🏪","tr8":"🌾","tr9":"🚪","tr10":"🐕","tr11":"🍊","tr12":"🛏️" };
var typeFilter = "all", htFilter = "all";
var HTYPES = ["전원·단독주택", "아파트", "빌라·연립", "원룸·투룸·오피스텔", "토지·밭", "상가·기타"];
/* 집 종류 — 글쓰기에서 고른 값이 있으면 그것, 없으면 제목·내용 단어로 추정 */
function htypeOf(p){
  if (p.htype) return p.htype;
  var t = (p.title || "") + " " + (p.content || "").slice(0, 80);
  if (/아파트/.test(t)) return "아파트";
  if (/빌라|연립|다세대/.test(t)) return "빌라·연립";
  if (/원룸|투룸|쓰리룸|오피스텔|방\s?[1-3]/.test(t)) return "원룸·투룸·오피스텔";
  if (/상가|사무실|창고/.test(p.title || "")) return "상가·기타";
  if (/토지|밭|임야|대지\s?\d/.test(p.title || "") && !/주택|구옥|독채/.test(p.title || "")) return "토지·밭";
  return "전원·단독주택";
}
function allRe(){ return userPostsOf("부동산").concat(TRADE_SEEDS.filter(function(p){ return p.board === "부동산"; })); }
var whoFilter = "all";
function applyWho(el){
  el.parentElement.querySelectorAll("button").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on"); whoFilter = el.dataset.who; render();
}
function applyHt(el){
  el.parentElement.querySelectorAll("button").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on"); htFilter = el.dataset.ht; render();
}
(function(){
  var all = allRe(), cnt = {};
  all.forEach(function(p){ var k = htypeOf(p); cnt[k] = (cnt[k] || 0) + 1; });
  var ICO = { "all": "🏘️", "전원·단독주택": "🏡", "아파트": "🏢", "빌라·연립": "🏬", "원룸·투룸·오피스텔": "🛏️", "토지·밭": "🌾", "상가·기타": "🏪" };
  var SHORT = { "원룸·투룸·오피스텔": "원룸·오피스텔" };
  document.getElementById("htype-bar").innerHTML = [["all", "전체", all.length]].concat(HTYPES.map(function(h){ return [h, SHORT[h] || h, cnt[h] || 0]; }))
    .map(function(x, i){ return '<button type="button" class="' + (i === 0 ? "on" : "") + '" data-ht="' + x[0] + '" onclick="applyHt(this)" title="' + x[0].replace("all", "전체") + '"><span class="rt-i">' + ICO[x[0]] + '</span><b>' + x[1] + '</b><small>' + x[2] + '</small></button>'; }).join("");
})();

function fmtPrice(p){
  if(!p) return "협의";
  if (String(p).indexOf("/") > -1 || String(p).indexOf("보증금") > -1) return p;
  var n = parseInt(String(p).replace(/[^0-9]/g,""), 10);
  if (isNaN(n)) return p;
  if (n >= 100000000) { var eok = Math.floor(n/100000000), rest = Math.round((n%100000000)/10000); return eok + "억" + (rest ? " " + rest.toLocaleString() : ""); }
  if (n >= 10000) return Math.round(n/10000).toLocaleString() + "만";
  return n.toLocaleString() + "원";
}
function applyChip(el){
  el.parentElement.querySelectorAll("button").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on");
  typeFilter = el.dataset.filter;
  render();
}
function reCard(p, isPm){
  var isUser = isUserPost(p), isMine = isMyPost(p);
  return photoCard(p, { pm: isPm, badge: { text: p.head || "매물" },
    info: '<b>' + escHtml(fmtPrice(p.price)) + '</b><span>' + escHtml(p.loc || "") + '</span>',
    mine: isMine ? "내 글" : "" });
}
function render(){
  var list = allRe();
  list = list.filter(function(p){ return typeFilter === "all" || (p.head || "") === typeFilter; });
  list = list.filter(function(p){ return htFilter === "all" || htypeOf(p) === htFilter; });
  list = list.filter(function(p){ if (whoFilter === "all") return true; var r = authorRoleOf(p); return whoFilter === "realtor" ? r === "realtor" : r === "direct"; });
  if (reQ) list = list.filter(function(p){ return ((p.title||"") + " " + (p.content||"") + " " + (p.loc||"")).indexOf(reQ) > -1; });
  document.getElementById("shown-count").textContent = list.length;
  renderSections({
    grid: document.getElementById("re-wrap"),
    list: list,
    card: reCard,
    emptyHtml: emptyInvite("부동산", "매물")
  });
}
/* ?q=한동 처럼 학교·마을 이름으로 매물 거르기 */
var reQ = (new URLSearchParams(location.search).get("q") || "").trim();
if (reQ) document.getElementById("re-count").insertAdjacentHTML("beforeend",
  '<span class="chip-btn on" style="cursor:default;margin-left:10px;font-size:13px">‘' + escHtml(reQ) + '’ 포함 <a href="realestate.html" style="margin-left:6px">✕</a></span>');
render();

/* 예전 주소(학교 연계 집 탭)로 들어오면 새 페이지로 */
(function(){
  var P = new URLSearchParams(location.search);
  if (P.get("tab") === "school" || P.get("house") || (location.hash === "#school-stay" && !P.get("q")))
    location.replace("school.html" + (P.get("house") ? "?house=" + encodeURIComponent(P.get("house")) : ""));
})();
window.onJIData = render;   // 서버에서 새 글을 받아오면 목록을 다시 그림
</script>
