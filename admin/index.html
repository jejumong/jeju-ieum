<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>제주이음 관리자 콘솔</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/style.css?v=20261106s">
<style>
body{background:#f3f5f8;margin:0}
.adm{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-radius:0;background:#0f1b2a;color:#c9d3de;padding:22px 14px;position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column}
.side .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:16.5px;padding:4px 10px 22px}
.side .brand small{display:block;font-size:11px;font-weight:600;color:#7f8fa2;letter-spacing:.06em}
.side .brand .logomark{width:32px;height:32px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#c9d3de;font:inherit;font-size:14.5px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left}
.side nav button:hover{background:#18283b;color:#fff}
.side nav button.on{background:#2b8ce6;color:#fff}
.side nav .cnt{margin-left:auto;background:#ff8a1f;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}
.side .foot{margin-top:auto;display:grid;gap:6px}
.side .foot a,.side .foot button{color:#9fb0c2;font-size:13px;background:none;border:0;text-align:left;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px;border-radius:8px}
.side .foot a:hover,.side .foot button:hover{background:#18283b;color:#fff}
.main{padding:28px 32px 60px;min-width:0}
.main h1{font-size:23px;font-weight:800;margin:0 0 4px;color:var(--ink)}
.main .sub{color:var(--ink-3);font-size:14px;margin:0 0 22px}
.panel{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:20px;margin-bottom:18px}
.panel h2{font-size:16px;font-weight:800;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:18px 20px}
.stat .k{font-size:13px;color:var(--ink-3);font-weight:600}
.stat .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input[type=search],.fld input,.fld select,.fld textarea{border:1px solid #dfe4ea;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar .total{margin-left:auto;color:var(--ink-3);font-size:13.5px}
table.adm-t{width:100%;border-collapse:collapse;font-size:13.5px}
table.adm-t th{background:#f6f8fa;color:var(--ink-3);font-weight:700;text-align:left;padding:10px 8px;border-bottom:1px solid #e6e9ee;white-space:nowrap}
table.adm-t td{padding:9px 8px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
table.adm-t tr:hover td{background:#fafbfc}
table.adm-t .ttl{max-width:340px}
table.adm-t .ttl a{color:var(--ink);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.adm-t .ttl a:hover{color:var(--sea)}
table.adm-t .ttl small{color:var(--ink-4);font-size:12px}
.bd{display:inline-block;font-size:11.5px;font-weight:700;background:#eef4fb;color:#1559b8;padding:3px 8px;border-radius:99px;white-space:nowrap}
.bd.user{background:#fff1e3;color:#b35604}
.num{width:76px;border:1px solid #dfe4ea;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;text-align:right}
.num.saved{border-color:#17a06a;background:#effaf4}
.sw{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#d7dde4;border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:#ff8a1f}
.sw input:checked+i:after{left:21px}
.sw.na{opacity:.25;pointer-events:none}
.acts{display:flex;gap:4px;white-space:nowrap}
.mb{border:1px solid #dfe4ea;background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.mb:hover{background:#f3f5f8}
.mb.del{color:#e04b3f;border-color:#f3c9c5}
.mb.del:hover{background:#fdedec}
.mb.pri{background:#2b8ce6;color:#fff;border-color:#2b8ce6}
.pager{display:flex;gap:4px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border:1px solid #dfe4ea;background:#fff;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700;color:var(--ink-2)}
.fld textarea{min-height:160px;resize:vertical;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(10,20,32,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:620px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 16px;font-size:18px;font-weight:800}
.modal .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1b2a;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pm-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.pm-item img{width:64px;height:46px;object-fit:cover;border-radius:8px;background:#eef1f4;flex-shrink:0}
.pm-item .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-item .t small{display:block;color:var(--ink-4);font-weight:500;font-size:12px}
.req{border:1px solid #e6e9ee;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.req .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.req .msg{background:#f6f8fa;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:10px}
.st-ok{color:#17a06a;font-weight:800;font-size:13px}.st-no{color:#e04b3f;font-weight:800;font-size:13px}
.empty{color:var(--ink-4);text-align:center;padding:30px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1b2a;padding:16px}
.gate .logomark{width:46px;height:46px;display:block}
.gate .box{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px}
.gate h2{margin:12px 0 4px;font-size:20px;font-weight:800}
.gate p{margin:0 0 18px;color:var(--ink-3);font-size:13.5px}
.gate input{width:100%;box-sizing:border-box;border:1px solid #dfe4ea;border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;margin-bottom:10px}
.gate .err{color:#e04b3f;font-size:13px;min-height:18px;margin-bottom:6px}
@media (max-width:900px){
  .adm{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:12px}
  .side .brand{padding:4px 8px;width:100%}
  .side nav{display:flex;flex-wrap:wrap;gap:4px}
  .side nav button{width:auto;padding:8px 10px;font-size:13px}
  .side .foot{margin:0;display:flex}
  .main{padding:20px 16px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .pm-grid,.row2{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
}
.role-help{background:#f7fbff;border:1px solid #dbe9fb;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.role-help ul{margin:6px 0 4px;padding-left:18px}
</style>
</head>
<body data-admin>

<div id="root"></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

<script src="../assets/common.js?v=20261106s"></script>
<script src="../assets/db.js?v=20261106s"></script>
<script src="../assets/seed-trade.js?v=20261106s"></script>
<script src="../assets/seed-extra.js?v=20261106s"></script>
<script src="../assets/seed-new.js?v=20261106s"></script>
<script src="../assets/seed-comments.js?v=20261106s"></script>
<script src="../assets/photos.js?v=20261106s"></script>
<script src="../assets/admin-data.js?v=20261106s"></script>
<script>
/* ─────────────────────────────────────────────
   제주이음 관리자 콘솔
   ※ 정적 프로토타입: 계정 확인이 브라우저 안에서만 이뤄집니다.
     실제 서비스에서는 서버 로그인·권한 확인으로 바꿔야 합니다.
   ───────────────────────────────────────────── */
var ADMIN_ID = "admin";
var DEFAULT_PW = "jeju2026!";
var SITE = "../";

function adminPw(){ return JI.get("admin_pw", DEFAULT_PW); }
function esc(s){ var d=document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove("on"); },1600); }

/* ── 로그인 ── */
function gate(){
  document.getElementById("root").innerHTML =
    '<div class="gate"><div class="box">' + LOGOMARK +
    '<h2>관리자 로그인</h2><p>제주이음 운영자 전용 페이지입니다.</p>' +
    '<input id="aid" placeholder="관리자 아이디" autocomplete="username">' +
    '<input id="apw" type="password" placeholder="비밀번호" autocomplete="current-password">' +
    '<div class="err" id="aerr"></div>' +
    '<button class="btn primary block" onclick="login()">로그인</button></div></div>';
  ["aid","apw"].forEach(function(i){ document.getElementById(i).addEventListener("keydown", function(e){ if(e.key==="Enter") login(); }); });
  document.getElementById("aid").focus();
}
function login(){
  var id=document.getElementById("aid").value.trim(), pw=document.getElementById("apw").value;
  if (id === ADMIN_ID && pw === adminPw()) { sessionStorage.setItem("ji_admin_ok","1"); boot(); }
  else document.getElementById("aerr").textContent = "아이디 또는 비밀번호가 맞지 않습니다.";
}
function logoutAdmin(){ sessionStorage.removeItem("ji_admin_ok"); gate(); }

/* ── 데이터 ── */
function userPosts(){ return JI.get("posts", []); }
function isUserPost(p){ return p.id.charAt(0) === "u"; }
function everyPost(){ return userPosts().concat(SEED_POSTS); }
function findAny(id){
  var all = everyPost();
  for (var i=0;i<all.length;i++) if (all[i].id === id) return all[i];
  return null;
}
/* 글 한 개의 값 바꾸기 — 회원 글은 ji_posts, 기본 글은 ji_admin_ov */
function setFields(p, obj){
  if (isUserPost(p)) {
    var posts = userPosts();
    posts.forEach(function(x){ if (x.id === p.id) for (var k in obj) x[k] = obj[k]; });
    JI.set("posts", posts);
  } else {
    var ov = adminOv(); ov[p.id] = ov[p.id] || {};
    for (var k in obj) ov[p.id][k] = obj[k];
    JI.set("admin_ov", ov);
  }
  for (var k2 in obj) p[k2] = obj[k2];
  _defaultPm = null;
}
function setViews(p, n){
  var v = JI.get("views", {}); delete v[p.id]; JI.set("views", v);
  setFields(p, { views: n });
}
function removeFrom(arr, p){ var i = arr.indexOf(p); if (i > -1) arr.splice(i, 1); }
function deletePost(p){
  if (isUserPost(p)) {
    JI.set("posts", userPosts().filter(function(x){ return x.id !== p.id; }));
    var cm = JI.get("comments", {}); delete cm[p.id]; JI.set("comments", cm);
  } else {
    var ov = adminOv(); ov[p.id] = ov[p.id] || {}; ov[p.id].deleted = true; JI.set("admin_ov", ov);
    removeFrom(SEED_POSTS, p); removeFrom(TRADE_SEEDS, p);
    if (REMOVED_SEEDS.indexOf(p) < 0) REMOVED_SEEDS.push(p);
  }
  _defaultPm = null;
}
function restorePost(p){
  var ov = adminOv(); if (ov[p.id]) { delete ov[p.id].deleted; JI.set("admin_ov", ov); }
  removeFrom(REMOVED_SEEDS, p);
  SEED_POSTS.push(p);
  if (TRADE_BOARDS.indexOf(p.board) > -1) TRADE_SEEDS.push(p);
  _defaultPm = null;
}
function cmtCount(p){ return typeof commentCountOf === "function" ? commentCountOf(p.id) : 0; }

/* ── 화면 틀 ── */
var view = "dash";
var MENU = [
  ["dash","대시보드"],["posts","게시글 관리"],["notices","공지 관리"],["premium","프리미엄 관리"],
  ["inquiries","문의·제보"],["sellers","판매자 승인"],["trash","삭제된 글"],["settings","설정"]
];
function boot(){
  var pending = JI.get("seller_requests", []).filter(function(r){ return r.status === "pending"; }).length;
  document.getElementById("root").innerHTML =
    '<div class="adm"><aside class="side">' +
      '<div class="brand">' + LOGOMARK + '<div>제주이음<small>ADMIN CONSOLE</small></div></div>' +
      '<nav>' + MENU.map(function(m){
        return '<button data-v="' + m[0] + '" class="' + (view===m[0]?"on":"") + '" onclick="go(\'' + m[0] + '\')">' + m[1] +
          (m[0]==="sellers" && pending ? '<span class="cnt">' + pending + '</span>' : '') + (m[0]==="inquiries" && newIq() ? '<span class="cnt">' + newIq() + '</span>' : '') + '</button>';
      }).join("") + '</nav>' +
      '<div class="foot"><a href="' + SITE + 'index.html" target="_blank">사이트 열기 ↗</a><button onclick="logoutAdmin()">로그아웃</button></div>' +
    '</aside><main class="main" id="main"></main></div>';
  draw();
}
function go(v){ view = v; boot(); window.scrollTo(0,0); }
function draw(){ ({inquiries:drawInquiries,dash:drawDash,posts:drawPosts,notices:drawNotices,premium:drawPremium,sellers:drawSellers,trash:drawTrash,settings:drawSettings})[view](); }
function M(){ return document.getElementById("main"); }

/* ── 문의·제보 (contact.html 신청서) ──
   ※ SITE_CFG.inquiryEndpoint 를 설정하지 않으면, 방문자가 남긴 신청서는 그 방문자 브라우저에만 저장됩니다.
     실제 운영 전에 Formspree·구글 폼 같은 수신 주소를 assets/common.js 의 SITE_CFG 에 넣어 주세요. */
var IQ_ST = { "new": "새 신청", "contacted": "연락함", "done": "완료" };
function newIq(){ return JI.get("inquiries", []).filter(function(q){ return q.status === "new"; }).length; }
function drawInquiries(){
  var list = JI.get("inquiries", []).slice().reverse();
  var warn = (SRV || (typeof SITE_CFG !== "undefined" && SITE_CFG.inquiryEndpoint)) ? "" :
    '<div class="panel" style="border:1px solid #ffe2c2;background:#fff8f0"><b>온라인 접수 주소가 아직 없어요.</b> 지금은 이 브라우저에서 남긴 신청서만 보입니다. ' +
    'assets/common.js 의 SITE_CFG.inquiryEndpoint(또는 contactEmail)를 채우면 실제 방문자 신청을 받을 수 있어요.</div>';
  M().innerHTML = '<h1>문의·제보</h1><p class="sub">정보 정정 요청, 가이드 제보, 입점·제휴 문의가 모입니다.</p>' + warn +
    '<div class="panel">' + (list.length ? '<div class="tbl-wrap"><table class="adm-t"><thead><tr><th>날짜</th><th>종류</th><th>이름·연락처</th><th>내용</th><th>상태</th><th></th></tr></thead><tbody>' +
      list.map(function(q){
        return '<tr><td style="white-space:nowrap">' + esc(q.date) + '</td><td><span class="bd">' + esc(q.type) + '</span></td>' +
          '<td><b>' + esc(q.name) + '</b><br><small>' + esc(q.contact) + '</small></td>' +
          '<td class="ttl"><small>' + esc([q.stage, q.when].filter(Boolean).join(" · ")) + '</small><div style="white-space:pre-wrap;max-width:420px">' + esc(q.msg) + '</div></td>' +
          '<td><select onchange="setIq(\'' + q.id + '\',this.value)">' + Object.keys(IQ_ST).map(function(k){ return '<option value="' + k + '"' + (q.status===k?" selected":"") + '>' + IQ_ST[k] + '</option>'; }).join("") + '</select></td>' +
          '<td><button class="mb" onclick="delIq(\'' + q.id + '\')">삭제</button></td></tr>';
      }).join("") + '</tbody></table></div>' : '<div class="empty">아직 들어온 신청이 없습니다.</div>') + '</div>';
}
function setIq(id, st){ var l = JI.get("inquiries", []); l.forEach(function(q){ if (q.id === id) q.status = st; }); JI.set("inquiries", l); toast("상태를 바꿨어요"); boot(); }
function delIq(id){ if (!confirm("이 신청을 삭제할까요?")) return; JI.set("inquiries", JI.get("inquiries", []).filter(function(q){ return q.id !== id; })); toast("삭제했어요"); boot(); }

/* ── 대시보드 ── */
function drawDash(){
  var all = everyPost();
  var views = all.reduce(function(s,p){ return s + viewsOf(p); }, 0);
  var members = JI.get("users", []).length;
  var pending = JI.get("seller_requests", []).filter(function(r){ return r.status === "pending"; }).length;
  var byBoard = ALL_BOARDS.map(function(b){
    var ps = all.filter(function(p){ return p.board === b; });
    return '<tr><td><span class="bd">' + esc(b) + '</span></td><td>' + ps.length + '</td><td>' +
      ps.filter(function(p){ return isUserPost(p); }).length + '</td><td>' +
      (PREMIUM_BOARDS.indexOf(b) > -1 ? ps.filter(isPremium).length : '—') + '</td><td>' +
      ps.reduce(function(s,p){ return s+viewsOf(p); },0).toLocaleString() + '</td>' +
      '<td><button class="mb" onclick="postBoard=\'' + b + '\';go(\'posts\')">관리</button></td></tr>';
  }).join("");
  var recent = userPosts().slice().sort(function(a,b){ return a.id < b.id ? 1 : -1; }).slice(0,6);
  M().innerHTML = '<h1>대시보드</h1><p class="sub">사이트 전체 현황입니다.</p>' +
    '<div class="stats">' +
      stat("전체 게시글", all.length.toLocaleString()) + stat("누적 조회수", views.toLocaleString()) +
      stat("가입 회원", members.toLocaleString()) + stat("승인 대기", pending) +
    '</div>' +
    '<div class="panel"><h2>게시판별 현황</h2><div class="tbl-wrap"><table class="adm-t"><thead><tr><th>게시판</th><th>글 수</th><th>회원 작성</th><th>프리미엄</th><th>조회수 합계</th><th></th></tr></thead><tbody>' + byBoard + '</tbody></table></div></div>' +
    '<div class="panel"><h2>최근 회원 작성 글</h2>' + (recent.length ? '<table class="adm-t"><tbody>' + recent.map(function(p){
      return '<tr><td><span class="bd user">' + esc(p.board) + '</span></td><td class="ttl"><a href="' + SITE + 'view.html?id=' + p.id + '" target="_blank">' + esc(p.title) + '</a></td><td>' + esc(p.author) + '</td><td>' + esc(p.date) + '</td></tr>';
    }).join("") + '</tbody></table>' : '<div class="empty">아직 회원이 쓴 글이 없습니다.</div>') + '</div>';
}
function stat(k,v){ return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

/* ── 게시글 관리 ── */
var postBoard = "all", postQ = "", postSort = "new", postPage = 1, PER = 20;
function filteredPosts(){
  var list = everyPost();
  if (postBoard !== "all") list = list.filter(function(p){ return p.board === postBoard; });
  if (postQ) { var k = postQ.toLowerCase(); list = list.filter(function(p){ return ((p.title||"")+" "+(p.author||"")+" "+(p.content||"")).toLowerCase().indexOf(k) > -1; }); }
  list = list.slice();
  if (postSort === "views") list.sort(function(a,b){ return viewsOf(b) - viewsOf(a); });
  else if (postSort === "likes") list.sort(function(a,b){ return likesOf(b) - likesOf(a); });
  else list.sort(function(a,b){ var x = a.date + (a.time || ''), y = b.date + (b.time || ''); return x < y ? 1 : x > y ? -1 : (a.id < b.id ? 1 : -1); });
  return list;
}

function bindRowControls(root){
  root.querySelectorAll("input.num").forEach(function(inp){
    function save(){
      var p = findAny(inp.dataset.id), n = Math.max(0, parseInt(inp.value, 10) || 0);
      if (!p) return;
      var cur = inp.dataset.f === "views" ? viewsOf(p) : likesOf(p);
      if (n === cur) return;
      if (inp.dataset.f === "views") setViews(p, n); else setFields(p, { likes: n });
      inp.value = n; inp.classList.add("saved"); setTimeout(function(){ inp.classList.remove("saved"); }, 900);
      toast((inp.dataset.f === "views" ? "조회수" : "좋아요") + "를 " + n.toLocaleString() + "(으)로 바꿨습니다");
    }
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { save(); inp.blur(); } });
    inp.addEventListener("change", save);
  });
  root.querySelectorAll("input[data-pm]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var p = findAny(cb.dataset.pm); if (!p) return;
      setFields(p, { premium: cb.checked });
      toast(cb.checked ? "프리미엄으로 등록했습니다" : "프리미엄에서 내렸습니다");

  });
}

  var list = reqs.filter(function(r){ return reqTab === "all" || r.status === reqTab; });
  var L = { pending:"대기중", approved:"승인됨", rejected:"반려됨", all:"전체" };
  M().innerHTML = '<h1>판매자 승인</h1><p class="sub">특가공구·제주상점 글쓰기 권한 요청과 공구 문의를 검토합니다.</p>' +

      return '<button class="mb' + (reqTab===t?' pri':'') + '" onclick="reqTab=\'' + t + '\';drawSellers()">' + L[t] + ' (' + (t==="all"?reqs.length:(counts[t]||0)) + ')</button>';

        '<div class="msg">' + esc(r.message) + '</div>' + act + '</div>';

function decide(id, status){
  var reqs = JI.get("seller_requests", []);
  var r = reqs.filter(function(x){ return x.id === id; })[0]; if (!r) return;

    JI.set("approved_sellers", ap);
  }
  toast(status === "approved" ? "승인했습니다" : "반려했습니다");
  boot();
}

var SRV = !!(window.JIDB && JIDB.enabled), STATS = null, USERS = [];
if (SRV) {
  isUserPost = function(p){ return !!(p && (p.db || (p.id && p.id.charAt(0) === "u"))); };
  userPosts = function(){ return localPosts(); };
  everyPost = function(){ return localPosts().concat(SEED_POSTS); };

  /* 관리자 설정(공지·프리미엄·숨김)은 서버에 저장 → 모든 방문자에게 반영 */
  var _set = JI.set;
  JI.set = function(k, v){
    _set.call(JI, k, v);
    if ((k === "admin_ov" || k === "notices") && JI._push) {
      JIDB.call("admin_set", { k: k, v: v }).catch(function(e){ alert("서버에 저장하지 못했어요: " + e.message); });
    }
  };
  function pushOn(fn){ return function(){ var prev = JI._push; JI._push = true; try { return fn.apply(this, arguments); } finally { JI._push = prev; } }; }

  var _setFields = setFields;
  setFields = function(p, obj){
    if (p.db) {
      var post = {}, ov = {};
      Object.keys(obj).forEach(function(k){ (["title","content","head","price","loc"].indexOf(k) > -1 ? post : ov)[k] = obj[k]; });
      if (Object.keys(post).length) JIDB.updatePost(p.id, post).then(function(){ draw(); }, function(e){ alert("수정하지 못했어요: " + e.message); });
      if (Object.keys(ov).length) { var all = adminOv(); all[p.id] = Object.assign(all[p.id] || {}, ov); JI.set("admin_ov", all); }
      for (var k in obj) p[k] = obj[k]; _defaultPm = null; return;
    }
    return _setFields(p, obj);
  };
  setFields = pushOn(setFields);
  var _deletePost = deletePost;
  deletePost = pushOn(function(p){
    if (p.db) { JIDB.deletePost(p.id).then(function(){ draw(); }, function(e){ alert("삭제하지 못했어요: " + e.message); }); return; }
    return _deletePost(p);
  });
  restorePost = pushOn(restorePost);
  saveNotice = pushOn(saveNotice); delNotice = pushOn(delNotice); setNotice = pushOn(setNotice);
  if (typeof togglePm === "function") togglePm = pushOn(togglePm);

  /* 문의·제보 */
  newIq = function(){ return STATS ? STATS.inquiries_new : 0; };
  setIq = function(id, st){ JIDB.call("admin_inquiry_set", { id: id, status: st }).then(function(){ toast("상태를 바꿨어요"); reloadAll(); }, function(e){ alert(e.message); }); };
  delIq = function(id){ if (!confirm("이 신청을 삭제할까요?")) return; JIDB.call("admin_inquiry_delete", { id: id }).then(function(){ toast("삭제했어요"); reloadAll(); }); };

  /* 운영자 이름으로 쪽지 보내기 (문의 답장·회원에게) */
  window.msgTo = function(uid, nick, inquiryId){
    showModal('<h3>✉️ ' + esc(nick) + '님에게 ' + (inquiryId ? '답장' : '쪽지') + '</h3>' +
      '<p style="margin:0 0 10px;color:var(--ink-3);font-size:13.5px">' + (inquiryId ? '"제주이음 운영자" 이름으로 쪽지가 가고, 알림·휴대폰 푸시로도 알려 줘요. 보내면 상태가 <b>완료</b>로 바뀌어요.' : '이 쪽지는 내 닉네임으로 보내져요.') + '</p>' +
      '<div class="fld"><textarea id="r-body" rows="7" maxlength="2000" placeholder="보낼 내용을 적어 주세요"></textarea></div>' +
      '<div class="bt"><button class="mb" onclick="closeModal()">취소</button><button class="mb pri" id="r-send">보내기</button></div>');
    var t = document.getElementById("r-body"); t.focus();
    document.getElementById("r-send").onclick = function(){
      var body = t.value.trim(); if (!body) { alert("내용을 적어 주세요."); return; }
      this.disabled = true;
      (inquiryId ? JIDB.call("admin_inquiry_reply", { id: inquiryId, body: body }) : JIDB.sendMessage(uid, body)).then(function(){
        closeModal(); toast("보냈어요"); if (inquiryId) reloadAll();
      }, function(e){ alert(e.message || e); document.getElementById("r-send").disabled = false; });
    };
  };
  var IQ_HELP = '<div class="panel role-help"><b>상태는 운영자끼리 처리 상황을 표시하는 용도예요.</b> 회원에게는 보이지 않아요.<ul>' +
    '<li><b>새 신청</b> — 아직 아무도 확인하지 않음 (메뉴에 숫자로 표시)</li><li><b>연락함</b> — 전화·쪽지 등으로 연락했지만 처리 중</li>' +
    '<li><b>완료</b> — 처리 끝. <b>답장하기</b>로 쪽지를 보내면 자동으로 완료가 돼요</li></ul>' +
    '로그인한 회원이 보낸 문의에만 쪽지로 답할 수 있어요. 로그인하지 않고 보낸 문의는 남긴 연락처로 연락해 주세요.</div>';
  drawInquiries = function(){
    var list = JI.get("inquiries", []).slice().reverse();
    M().innerHTML = '<h1>문의·제보</h1><p class="sub">정보 정정 요청, 가이드 제보, 입점·제휴 문의가 모입니다.</p>' + IQ_HELP +
      '<div class="panel">' + (list.length ? '<div class="tbl-wrap"><table class="adm-t"><thead><tr><th>날짜</th><th>종류</th><th>보낸 사람</th><th>내용</th><th>상태</th><th></th></tr></thead><tbody>' +
        list.map(function(q){
          return '<tr><td style="white-space:nowrap">' + esc(q.date) + '</td><td><span class="bd">' + esc(q.type || q.service || "문의") + '</span></td>' +
            '<td><b>' + esc(q.name) + '</b>' + (q.user_nick ? ' <span class="bd user">회원 ' + esc(q.user_nick) + '</span>' : ' <small>(비회원)</small>') + '<br><small>' + esc(q.contact) + '</small></td>' +
            '<td class="ttl"><small>' + esc([q.stage, q.when].filter(Boolean).join(" · ")) + '</small><div style="white-space:pre-wrap;max-width:420px">' + esc(q.msg) + '</div>' +
              (q.replied_at ? '<small style="color:var(--sea-700)">✉️ ' + esc(q.replied_at) + ' 답장함</small>' : '') + '</td>' +
            '<td><select onchange="setIq(\'' + q.id + '\',this.value)">' + Object.keys(IQ_ST).map(function(k){ return '<option value="' + k + '"' + (q.status===k?" selected":"") + '>' + IQ_ST[k] + '</option>'; }).join("") + '</select></td>' +
            '<td><div class="acts">' + (q.user_id ? '<button class="mb pri" onclick="msgTo(\'' + q.user_id + '\',\'' + esc(q.user_nick || q.name).replace(/'/g, "") + '\',\'' + q.id + '\')">답장하기</button>' : '') +
            '<button class="mb" onclick="delIq(\'' + q.id + '\')">삭제</button></div></td></tr>';
        }).join("") + '</tbody></table></div>' : '<div class="empty">아직 들어온 신청이 없습니다.</div>') + '</div>';
  };

  /* 판매자 승인 */
  decide = function(id, status){
    JIDB.call("admin_seller_decide", { id: id, status: status }).then(function(){
      toast(status === "approved" ? "승인했습니다 — 역할이 상점·공구판매자로 바뀌고 알림이 갔어요" : "반려했습니다"); reloadAll();
    }, function(e){ alert(e.message); });
  };

  /* 회원 관리 (서버 모드에서만) */
  MENU.splice(MENU.length - 1, 1, ["members", "회원 관리"]);
  var _draw = draw;
  draw = function(){ if (view === "members") return drawMembers(); if (view === "settings") view = "members"; return _draw(); };
  window.drawMembers = function(){
    var R = { user: "일반", realtor: "부동산 중개인", shop: "상점판매자", dealer: "공구판매자", staff: "스텝" };
    var me = JIDB.me(), boss = me && me.role === "admin";
    var cnt = {}; USERS.forEach(function(u){ cnt[u.role] = (cnt[u.role] || 0) + 1; });
    M().innerHTML = '<h1>회원 관리</h1><p class="sub">가입한 회원 ' + USERS.length + '명 · ' + Object.keys(ROLE_LABEL).filter(function(k){ return cnt[k]; }).map(function(k){ return ROLE_LABEL[k] + ' ' + cnt[k]; }).join(" · ") + '</p>' +
      '<div class="panel role-help"><b>역할별 권한</b><ul>' +
        '<li><b>일반</b> — 커뮤니티·거래 글쓰기, 댓글, 쪽지</li>' +
        '<li><b>부동산 중개인</b> — 일반 권한 + 중개인으로 구분 (부동산 글은 누구나 쓸 수 있어요)</li>' +
        '<li><b>상점판매자</b> — 제주상점 글쓰기 · <b>공구판매자</b> — 특가공구 글쓰기</li>' +
        '<li><b>스텝</b> — 관리자 페이지 이용, 남의 글·댓글 정리 (회원 역할은 못 바꿈)</li>' +
        '<li><b>관리자</b> — 모든 권한. GitHub Secrets 의 ADMIN_EMAILS 로만 정해져요</li></ul></div>' +
      '<div class="panel">' + (USERS.length ? '<div class="tbl-wrap"><table class="adm-t"><thead><tr><th>닉네임</th><th>이메일</th><th>지역</th><th>글</th><th>댓글</th><th>가입일</th><th>최근 로그인</th><th>역할</th><th></th></tr></thead><tbody>' +
        USERS.map(function(u){
          var roleCell = u.role === "admin" ? '<span class="bd user">관리자</span>'
            : (!boss || (me && u.id === me.id)) ? '<span class="bd">' + esc(ROLE_LABEL[u.role] || u.role) + '</span>'
            : '<select onchange="setRole(\'' + u.id + '\',this.value)">' + Object.keys(R).map(function(k){ return '<option value="' + k + '"' + (u.role===k?" selected":"") + '>' + R[k] + '</option>'; }).join("") + '</select>';
          return '<tr><td><b>' + esc(u.nick) + '</b></td><td><small>' + esc(u.email) + '</small></td><td>' + esc(u.region) + '</td>' +
            '<td>' + u.posts + '</td><td>' + u.comments + '</td>' +
            '<td style="white-space:nowrap">' + esc((u.created_at||"").slice(0,10)) + '</td><td style="white-space:nowrap">' + esc((u.last_login||"").slice(0,10)) + '</td>' +
            '<td>' + roleCell + '</td>' +
            '<td>' + (me && u.id === me.id ? '' : '<button class="mb" onclick="msgTo(\'' + u.id + '\',\'' + esc(u.nick).replace(/'/g, "") + '\')">✉️ 쪽지</button>') + '</td></tr>';
        }).join("") + '</tbody></table></div>' : '<div class="empty">아직 가입한 회원이 없습니다.</div>') + '</div>' +
      '<div class="panel"><h2>관리자 비밀번호</h2><p style="margin:0;color:var(--ink-3)">관리자 페이지는 사이트 회원 계정으로 들어와요. 비밀번호는 사이트의 <a href="' + SITE + 'profile.html" target="_blank">내 정보</a>에서 바꿀 수 있어요.</p></div>';
  };
  window.setRole = function(id, role){ JIDB.call("admin_set_role", { id: id, role: role }).then(function(){ toast("역할을 바꿨어요"); reloadAll(); }, function(e){ alert(e.message); reloadAll(); }); };

  /* 대시보드 숫자: 회원 수는 서버 기준 */
  var _drawDash = drawDash;
  drawDash = function(){
    _drawDash();
    if (STATS) { var vs = M().querySelectorAll(".stat .v"); if (vs[2]) vs[2].textContent = STATS.users.toLocaleString() + (STATS.users_week ? " (+" + STATS.users_week + ")" : ""); }
  };

  logoutAdmin = function(){ location.href = SITE + "index.html"; };

  /* 서버에서 모두 불러와 브라우저 캐시에 채운 뒤 화면 그리기 */
  window.reloadAll = function(){
    return Promise.all([
      JIDB.syncFeed().then(function(changed){
        // 처음 여는 기기면 서버 설정(숨긴 글 등)을 반영하려고 한 번 새로 고침
        if (changed && !sessionStorage.getItem("ji_admin_synced")) { sessionStorage.setItem("ji_admin_synced", "1"); location.reload(); }
      }),
      JIDB.call("admin_overview").then(function(r){ STATS = r; }),
      JIDB.call("admin_inquiries").then(function(l){ _set.call(JI, "inquiries", l.reverse()); }),
      JIDB.call("admin_sellers").then(function(l){
        _set.call(JI, "seller_requests", l.reverse().map(function(r){
          var det = r.details && typeof r.details === "object" ? Object.keys(r.details).map(function(k){ return k + ": " + r.details[k]; }).join("\n") : "";
          return { id: r.id, board: r.board, nick: r.applicant_nick, email: r.email, region: r.region, status: r.status,
            date: (r.created_at || "").slice(0, 10), message: (det ? det + "\n" : "") + (r.message || "") };
        }));
      }),
      JIDB.call("admin_users").then(function(l){ USERS = l; })
    ]).then(function(){ boot(); });
  };

  JIDB.ready.then(function(){
    var u = JIDB.me();
    if (!u) { location.href = SITE + "login.html?next=" + encodeURIComponent("admin/index.html"); return; }
    if (u.role !== "admin" && u.role !== "staff") {
      document.getElementById("root").innerHTML = '<div class="gate"><div class="box">' + LOGOMARK + '<h2>관리자만 들어올 수 있어요</h2>' +
        '<p>' + esc(u.nick) + '님은 관리자 계정이 아니에요.<br>GitHub Secrets 의 ADMIN_EMAILS 에 넣은 이메일로 가입·로그인해 주세요.</p>' +
        '<a class="btn primary block" href="' + SITE + 'index.html">사이트로 돌아가기</a></div></div>';
      return;
    }
    document.getElementById("root").innerHTML = '<div class="gate"><div class="box">' + LOGOMARK + '<h2>불러오는 중…</h2></div></div>';
    reloadAll().catch(function(e){ alert("관리자 데이터를 불러오지 못했어요: " + e.message); });
  });
} else {
  if (sessionStorage.getItem("ji_admin_ok") === "1") boot(); else gate();
}
</script>
</body>
</html>
