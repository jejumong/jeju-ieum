<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>제주이음 관리자 콘솔</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이음 관리">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../assets/icons/favicon.png?v=2">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/style.css?v=20261128c">
<style>
body{background:#f3f5f8;margin:0}
.adm{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-radius:0;background:#0f1b2a;color:#c9d3de;padding:22px 14px;position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column}
.side .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:16.5px;padding:4px 10px 22px}
.side .brand small{display:block;font-size:11px;font-weight:600;color:#7f8fa2;letter-spacing:.06em}
.side .brand .logomark{width:38px;height:32px;color:#fff}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#c9d3de;font:inherit;font-size:14.5px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left}
.side nav button:hover{background:#18283b;color:#fff}
.side nav button.on{background:#2b8ce6;color:#fff}
.side nav .cnt{margin-left:auto;background:#ff8a1f;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}
.side .foot{margin-top:auto;display:grid;gap:6px}
.side .foot a,.side .foot button{color:#9fb0c2;font-size:13px;background:none;border:0;text-align:left;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px;border-radius:8px}
.side .foot a:hover,.side .foot button:hover{background:#18283b;color:#fff}
.main{padding:28px 32px 60px;min-width:0}
.main h1{font-size:23px;font-weight:800;margin:0 0 4px;color:var(--ink)}
.main .sub{color:var(--ink-3);font-size:14px;margin:0 0 22px}
.panel{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:20px;margin-bottom:18px}
.panel h2{font-size:16px;font-weight:800;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:18px 20px}
.stat .k{font-size:13px;color:var(--ink-3);font-weight:600}
.stat .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input[type=search],.fld input,.fld select,.fld textarea{border:1px solid #dfe4ea;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar .total{margin-left:auto;color:var(--ink-3);font-size:13.5px}
table.adm-t{width:100%;border-collapse:collapse;font-size:13.5px}
table.adm-t th{background:#f6f8fa;color:var(--ink-3);font-weight:700;text-align:left;padding:10px 8px;border-bottom:1px solid #e6e9ee;white-space:nowrap}
table.adm-t td{padding:9px 8px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
table.adm-t tr:hover td{background:#fafbfc}
table.adm-t .ttl{max-width:340px}
table.adm-t .ttl a{color:var(--ink);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.adm-t .ttl a:hover{color:var(--sea)}
table.adm-t .ttl small{color:var(--ink-4);font-size:12px}
.bd{display:inline-block;font-size:11.5px;font-weight:700;background:#eef4fb;color:#1559b8;padding:3px 8px;border-radius:99px;white-space:nowrap}
.bd.user{background:#fff1e3;color:#b35604}
.num{width:76px;border:1px solid #dfe4ea;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;text-align:right}
.num.saved{border-color:#17a06a;background:#effaf4}
.sw{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#d7dde4;border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:#ff8a1f}
.sw input:checked+i:after{left:21px}
.sw.na{opacity:.25;pointer-events:none}
.acts{display:flex;gap:4px;white-space:nowrap}
.mb{border:1px solid #dfe4ea;background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.mb:hover{background:#f3f5f8}
.mb.del{color:#e04b3f;border-color:#f3c9c5}
.mb.del:hover{background:#fdedec}
.mb.pri{background:#2b8ce6;color:#fff;border-color:#2b8ce6}
.pager{display:flex;gap:4px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px;border:1px solid #dfe4ea;background:#fff;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700;color:var(--ink-2)}
.fld textarea{min-height:160px;resize:vertical;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(10,20,32,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:620px;max-height:90vh;overflow:auto}
.modal{overscroll-behavior:contain;touch-action:none}
html.m-lock{overflow:hidden}
.modal .box{max-height:88svh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
@media (max-width:760px){ .modal{align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 12px 14px} .modal .box{padding:18px 16px;max-height:calc(100svh - 28px)} }
.modal h3{margin:0 0 16px;font-size:18px;font-weight:800}
.modal .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1b2a;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pm-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f5}
.pm-item img{width:64px;height:46px;object-fit:cover;border-radius:8px;background:#eef1f4;flex-shrink:0}
.pm-item .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-item .t small{display:block;color:var(--ink-4);font-weight:500;font-size:12px}
.req{border:1px solid #e6e9ee;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.req .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.req .msg{background:#f6f8fa;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:10px}
.st-ok{color:#17a06a;font-weight:800;font-size:13px}.st-no{color:#e04b3f;font-weight:800;font-size:13px}
.empty{color:var(--ink-4);text-align:center;padding:30px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1b2a;padding:16px}
.gate .logomark{width:56px;height:46px;display:block;color:#0D2440}
.gate .box{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:380px}
.gate h2{margin:12px 0 4px;font-size:20px;font-weight:800}
.gate p{margin:0 0 18px;color:var(--ink-3);font-size:13.5px}
.gate input{width:100%;box-sizing:border-box;border:1px solid #dfe4ea;border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;margin-bottom:10px}
.gate .err{color:#e04b3f;font-size:13px;min-height:18px;margin-bottom:6px}
@media (max-width:900px){
  .adm{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:12px}
  .side .brand{padding:4px 8px;width:100%}
  .side nav{display:flex;flex-wrap:wrap;gap:4px}
  .side nav button{width:auto;padding:8px 10px;font-size:13px}
  .side .foot{margin:0;display:flex}
  .main{padding:20px 16px 50px}
  .stats{grid-template-columns:1fr 1fr}
  .pm-grid,.row2{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
}
.role-help{background:#f7fbff;border:1px solid #dbe9fb;font-size:13.5px;color:var(--ink-2);line-height:1.7}
.role-help ul{margin:6px 0 4px;padding-left:18px}
.cnt-link{border:0;background:none;padding:2px 6px;border-radius:6px;font:inherit;font-weight:800;color:var(--sea-700);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cnt-link:hover{background:var(--sea-50)}
.act-scroll{max-height:60vh;overflow:auto;margin-bottom:12px}
.act-t td,.act-t th{font-size:13.5px}
.iq-cell{cursor:pointer}
.iq-cell:hover .iq-more{text-decoration:underline}
.iq-clamp{max-width:420px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.iq-more{font-size:12px;font-weight:700;color:var(--sea-700)}
.iq-meta{font-size:13px;color:var(--ink-3);margin:-4px 0 12px}
.iq-dl{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:14px}
.iq-dl th{text-align:left;width:96px;color:var(--ink-3);font-weight:700;padding:6px 8px 6px 0;vertical-align:top}
.iq-dl td{padding:6px 0;border-bottom:1px solid #f0f2f5;white-space:pre-wrap}
.iq-msg{white-space:pre-wrap;line-height:1.75;background:#f8fafc;border:1px solid #e6e9ee;border-radius:10px;padding:14px 16px;max-height:50vh;max-height:50svh;overflow:auto;overscroll-behavior:contain;margin-bottom:14px;font-size:14.5px}
tr.iq-new td{background:#fff6ea}
tr.iq-new td:first-child{box-shadow:inset 4px 0 0 #ff9a2e}
tr.iq-new .iq-clamp{font-weight:700;color:var(--ink)}
.iq-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff7a00;margin-right:6px;vertical-align:1px}
/* 긴 글·띄어쓰기 없는 글도 칸 안에서 줄바꿈 */
.iq-msg,.iq-dl td,.iq-clamp,.adm-t td,.modal .box{overflow-wrap:anywhere;word-break:break-word}
.iq-msg{white-space:pre-wrap!important;max-width:100%}

.al-list{display:flex;flex-direction:column}
.al-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 4px;border-top:1px solid var(--line);cursor:pointer}
.al-row:first-child{border-top:0}
.al-row b{display:block;font-size:15px;color:var(--ink)}
.al-row small{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.al-row input{position:absolute;opacity:0;pointer-events:none}
.al-row i{flex:none;width:46px;height:26px;border-radius:999px;background:#cfd6de;position:relative;transition:background .15s}
.al-row i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.al-row input:checked + i{background:var(--sea-600)}
.al-row input:checked + i::after{left:23px}
.al-row input:focus-visible + i{outline:2px solid var(--sea-600);outline-offset:2px}
.pd-now{padding:14px 16px;border-radius:12px;margin-bottom:12px}.pd-now.ok{background:#ecf8f0;color:#14532d}.pd-now.no{background:#fff4e5;color:#7c2d12}
.pd-now b{display:block;font-size:15px}.pd-now small{display:block;margin-top:4px;font-size:13px;line-height:1.5;opacity:.9}
.pd-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pd-list>b{font-size:14px}.pd-list ul{list-style:none;margin:8px 0 0;padding:0;border:1px solid #e5e9ef;border-radius:12px}
.pd-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #eef1f5;font-size:14px;font-weight:600}.pd-list li:last-child{border-bottom:0}
.pd-list li.me{background:#eef4fd}.pd-list li small{color:var(--ink-4,#8a96a3);font-weight:600}
.al-note{font-size:13px;color:var(--ink-3);margin:14px 4px 0;line-height:1.6}

/* 로고: 사이트 공용 .brand 모양(흰 알약)을 쓰지 않음 */
.side a.brand{text-decoration:none;cursor:pointer;background:none;border:0;box-shadow:none;border-radius:0;justify-content:flex-start;text-align:left;min-height:0}
.side a.brand div{text-align:left;color:#fff}
@media (max-width:900px){
  .adm{grid-template-rows:auto 1fr}
  .side{display:grid;grid-template-columns:1fr auto;align-items:center;align-content:start;gap:8px 6px;padding:10px 12px}
  .side a.brand{width:auto;padding:2px 4px;font-size:15px}
  .side a.brand small{font-size:10px}
  .side .foot{grid-column:2;grid-row:1;gap:2px}
  .side .foot a,.side .foot button{font-size:12.5px;padding:6px 8px;white-space:nowrap}
  .side nav{grid-column:1 / -1;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}
  .side nav::-webkit-scrollbar{display:none}
  .side nav button{flex:none;white-space:nowrap}
}
/* 회원 관리: PC 는 한 줄로 */
table.mem-t td,table.mem-t th{white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
table.mem-t td small{font-size:13px}
.mem-cards{display:none}
.bd.susp{background:#fdecec;color:#b42318}
.mb.danger-o{color:#b42318;border-color:#f3c6c2}
.mb.susp-on{background:#fdecec;color:#b42318;border-color:#f3c6c2}
.mem-t .acts{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.mem-t .acts .mb{padding:5px 9px;font-size:12.5px;white-space:nowrap;text-align:center}
.mem-t .bd.susp{display:block;width:max-content;margin-top:4px;font-size:11px}
.sus-l{display:block;font-weight:700;font-size:13.5px;margin:14px 0 6px}
.sus-l small{font-weight:600;color:var(--ink-4)}
#sus-r{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #dfe3ea;border-radius:10px;font:inherit}
.sus-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sus-o{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 6px;border:1px solid #f3c6c2;border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:#b42318}
.sus-o b{font-size:16px}.sus-o small{font-size:11.5px;color:var(--ink-4);text-align:center}
.sus-o:hover{background:#fdecec}.sus-o.perm{background:#fff5f4}
.mem-card.susp{border-color:#f3c6c2;background:#fffafa}
.mc-susp{margin-top:6px}.mc-susp .bd{margin:0}
.mc-btns{display:flex;gap:6px;flex:none}
@media (max-width:760px){
  .mem-wrap{display:none}
  .mem-cards{display:flex;flex-direction:column;gap:10px}
  .mem-card{border:1px solid #e6e9ee;border-radius:14px;padding:13px 14px;background:#fff}
  .mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mc-top b{font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-top select{max-width:140px}
  .mc-mail{font-size:13.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13.5px;color:var(--ink-2)}
  .mc-meta span{white-space:nowrap}
  .mc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid #f0f2f5}
  .mc-foot small{color:var(--ink-4);font-size:12px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .mc-foot .mb{white-space:nowrap;flex:none}
  .mc-top{flex-wrap:wrap}
  .mc-top b{flex:1;min-width:60px}
  .mc-top .sp-btn{order:9;flex:1 1 100%;margin-top:2px;padding:6px 10px;font-size:13px;text-align:left;white-space:normal}
}
.op-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.op-bar label{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.op-row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line-2,#eef1f4)}
.op-tabs{display:flex;gap:6px;margin:4px 0 12px}
.n-per{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.n-per button{padding:8px 16px;border:1px solid #dfe3ea;border-radius:999px;background:#fff;font:inherit;font-size:14px;font-weight:700;color:var(--ink-3);cursor:pointer}
.n-per button.on{background:#0e2440;border-color:#0e2440;color:#fff}
.n-per-t{font-size:13px;color:var(--ink-3);margin-left:4px}
.n-per-date{padding:7px 10px;border:1px solid #0e2440;border-radius:10px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-1,#111)}
.n-per-date[hidden]{display:none}
small.n-until{display:block;margin-top:4px;font-size:12px;color:var(--ink-4)}
.adm-t td.num-ro{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.op-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 12px}.op-top .op-tabs{margin:0}
.op-q{display:flex;align-items:center;gap:8px;flex:1 1 240px;max-width:380px}
.op-q input{flex:1;min-width:0;padding:9px 14px;border:1px solid #dfe3ea;border-radius:999px;font:inherit;font-size:14px;background:#fff}
.op-q input:focus{outline:none;border-color:#1f6fb2;box-shadow:0 0 0 3px rgba(31,111,178,.12)}
.op-q span{font-size:13px;color:var(--ink-3);white-space:nowrap}
@media (max-width:680px){ .op-q{max-width:none;flex-basis:100%} }
.rep-card{border:1px solid #eef1f5;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.dv-grid{display:grid;grid-template-columns:minmax(220px,0.8fr) 1fr 1fr;gap:14px}
.dv-col{background:#f8fafc;border-radius:12px;padding:14px 16px;min-width:0}
.dv-col .tm-h3{margin-top:0}
.dv-sum{display:flex;align-items:center;gap:18px;padding:6px 0}
.dv-ring{flex:none;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative}
.dv-ring span{width:78px;height:78px;border-radius:50%;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink-4);line-height:1.2}
.dv-ring b{font-size:20px;color:var(--ink)}
.dv-leg{display:flex;flex-direction:column;gap:12px;min-width:0}
.rf-leg{gap:7px}.rf-leg b{font-size:16px}.rf-leg small{display:none}
.dv-leg div{display:grid;grid-template-columns:12px auto;column-gap:7px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.dv-leg i{width:12px;height:12px;border-radius:4px;grid-row:1 / 4;align-self:start;margin-top:4px}
.dv-leg b{grid-column:2;font-size:20px;color:var(--ink);line-height:1.2}
.dv-leg span{grid-column:2}
.dv-leg small{grid-column:2;font-size:12px;color:var(--ink-4)}
@media (max-width:1000px){.dv-grid{grid-template-columns:1fr 1fr}.dv-grid .dv-col:first-child{grid-column:1 / -1}}

function bindRowControls(root){

      var f = inp.dataset.f, done = function(){
        inp.value = n; inp.classList.add("saved"); setTimeout(function(){ inp.classList.remove("saved"); }, 900);

/* 오늘부터 d일 동안 (오늘 포함) → 마지막 날 */
function noticeUntil(d){ var t = new Date(); t.setDate(t.getDate() + d - 1); return t.getFullYear() + "-" + ("0" + (t.getMonth() + 1)).slice(-2) + "-" + ("0" + t.getDate()).slice(-2); }
/* 공지 기간: 7·14·30일·영구 버튼 + 달력으로 마지막 날 직접 고르기 */

function perUntil(box){
  var per = box.querySelector("#n-per button.on"), dd = per ? per.dataset.d : "0";

    var v = box.querySelector(".n-per-date").value;
    if (!v) { alert("공지를 표시할 마지막 날을 달력에서 골라 주세요."); return false; }
    if (v < today()) { alert("오늘이나 그 뒤의 날짜를 골라 주세요."); return false; }
    return v;

function bindNoticePer(root){

      txt.textContent = dt.value.slice(5).replace("-", ".") + "(" + WD[x.getDay()] + ")까지 표시되고, 그다음 날 '지난 공지'로 넘어가요"; return;

  var AU_REPO = "https://api.github.com/repos/jejumong/jeju-ieum";
  function auFetch(){
    try { var c = JSON.parse(sessionStorage.getItem("ji_au") || "null"); if (c && Date.now() - c.t < 300000) return Promise.resolve(c.d); } catch (e) {}
    var j = function(u){ return fetch(u, { headers: { Accept: "application/vnd.github+json" } }).then(function(r){ if (!r.ok) throw new Error("GitHub " + r.status); return r.json(); }); };
    return Promise.all([j(AU_REPO + "/commits?per_page=100"), j(AU_REPO + "/actions/runs?per_page=60")]).then(function(a){
      var d = { commits: a[0].map(function(c){ return { m: (c.commit.message || "").split("\n")[0], at: c.commit.committer.date }; }),
        runs: (a[1].workflow_runs || []).map(function(r){ return { n: r.name, st: r.status, c: r.conclusion, at: r.updated_at || r.created_at, url: r.html_url }; }) };
      try { sessionStorage.setItem("ji_au", JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
      return d;
    });
  }
  function auAgo(iso){ var m = Math.floor((Date.now() - new Date(iso)) / 60000); if (m < 60) return m + "분 전"; if (m < 1440) return Math.floor(m / 60) + "시간 전"; return Math.floor(m / 1440) + "일 전"; }
  function auWhen(iso){ var d = new Date(iso); return (d.getMonth() + 1) + "." + d.getDate() + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function autoStatus(el){
    var list = el.querySelector(".au-list");
    auFetch().then(function(d){
      var JOBS = [
        { t: "축제·달력 갱신", s: "매일 오후 1시", re: /^달력·축제 갱신|^마을 행사 갱신/, max: 26 },
        { t: "지원 프로그램·학교 연계 집 확인", s: "매일 아침 8시 (오후 3시는 바뀐 게 있을 때만 기록)", re: /^지원 프로그램·학교 연계 집 확인|^지원 프로그램/, max: 26 },
        { t: "검색용 페이지 자동 갱신", s: "글·데이터가 바뀔 때마다", re: /^검색용 페이지 자동 갱신/, max: 48 }
      ];
      var rows = JOBS.map(function(j){
        var c = d.commits.filter(function(x){ return j.re.test(x.m); })[0];
        var h = c ? (Date.now() - new Date(c.at)) / 36e5 : 1e9, ok = h <= j.max;
        return '<div class="au-row ' + (ok ? 'ok' : 'bad') + '"><span class="au-dot"></span><div class="au-b"><b>' + j.t + '</b><small>' + j.s + '</small>' +
          (c ? '<em title="' + esc(c.m) + '">' + esc(c.m.length > 70 ? c.m.slice(0, 70) + "…" : c.m) + '</em>' : '') + '</div>' +
          '<div class="au-t">' + (c ? '<b>' + auAgo(c.at) + '</b><small>' + auWhen(c.at) + '</small>' : '<b>기록 없음</b>') + (ok ? '' : '<span class="au-warn">늦어지고 있어요</span>') + '</div></div>';
      });
      var WF = [["build-search-pages", "검색용 페이지·사이트맵 만들기"], ["pages build and deployment", "홈페이지(GitHub Pages) 반영"], ["카페24 서버(api) 올리기", "카페24 서버 올리기"], ["notify-subscribers", "새 공고 알림 보내기"], ["메일 발송 점검", "메일 발송 점검"]];
      var wr = WF.map(function(w){
        var r = d.runs.filter(function(x){ return x.n === w[0]; })[0]; if (!r) return "";
        var run = r.st !== "completed", ok = run || r.c === "success" || r.c === "skipped";
        return '<div class="au-row ' + (run ? 'run' : ok ? 'ok' : 'bad') + '"><span class="au-dot"></span><div class="au-b"><b>' + w[1] + '</b><small>마지막 실행 결과</small></div>' +
          '<div class="au-t"><b>' + (run ? '실행 중' : ok ? '성공' : '실패') + '</b><small>' + auAgo(r.at) + '</small>' + (ok ? '' : '<a href="' + r.url + '" target="_blank" class="au-warn">기록 보기 ↗</a>') + '</div></div>';
      }).join("");
      list.innerHTML = '<h3 class="tm-h3">매일 도는 작업</h3>' + rows.join("") + (wr ? '<h3 class="tm-h3">자동 반영 작업</h3>' + wr : '') +
        '<p class="sub" style="margin:10px 0 0">초록 = 정상, 빨강 = 정해진 시간보다 오래 기록이 없거나 실패. 5분마다 새로 읽어요.</p>';
    }, function(e){ list.innerHTML = '<div class="empty" style="padding:12px">상태를 불러오지 못했어요 (' + esc(e.message) + '). 잠시 뒤 다시 열어 주세요.</div>'; });
  }

  /* 관리자 정보 수정 (비밀번호) */
  window.drawAccount = function(){
    M().innerHTML = '<h1>관리자 정보 수정</h1><p class="sub">관리자 계정 비밀번호를 바꿔요.</p>' +
      '<div class="panel" id="pw-panel"><h2>관리자 비밀번호 바꾸기</h2>' +
        '<p style="margin:0 0 12px;color:var(--ink-3)">' + esc((JIDB.me() || {}).email || "") + ' 계정의 비밀번호를 바꿔요. 바꾸면 이 창을 뺀 다른 기기·브라우저(사이트 포함)는 로그아웃돼요.</p>' +
        '<form id="pw-f" class="pw-f" autocomplete="off">' +
          '<label>현재 비밀번호<input type="password" id="pw-cur" autocomplete="current-password" required></label>' +
          '<label>새 비밀번호 (8자 이상)<input type="password" id="pw-new" autocomplete="new-password" minlength="8" required></label>' +
          '<label>새 비밀번호 확인<input type="password" id="pw-new2" autocomplete="new-password" minlength="8" required></label>' +
          '<div class="pw-act"><span class="pw-msg" id="pw-msg"></span><button class="btn primary" type="submit">비밀번호 바꾸기</button></div>' +
        '</form></div>';
    var pf = document.getElementById("pw-f");
    if (pf) pf.onsubmit = function(e){
      e.preventDefault();
      var cur = document.getElementById("pw-cur").value, n1 = document.getElementById("pw-new").value, n2 = document.getElementById("pw-new2").value;
      var msg = document.getElementById("pw-msg"); msg.className = "pw-msg";
      if (n1.length < 8) { msg.textContent = "새 비밀번호는 8자 이상이어야 해요."; msg.classList.add("bad"); return; }
      if (n1 !== n2) { msg.textContent = "새 비밀번호가 서로 달라요."; msg.classList.add("bad"); return; }
      if (n1 === cur) { msg.textContent = "지금 비밀번호와 다른 비밀번호로 정해 주세요."; msg.classList.add("bad"); return; }
      var b = pf.querySelector("button"); b.disabled = true; b.textContent = "바꾸는 중…";
      JIDB.call("password_change", { cur: cur, "new": n1 }).then(function(){
        pf.reset(); msg.textContent = "비밀번호를 바꿨어요. 다음 로그인부터 새 비밀번호를 써 주세요."; msg.classList.add("ok");
      }, function(err){ msg.textContent = err.message; msg.classList.add("bad"); })
        .then(function(){ b.disabled = false; b.textContent = "비밀번호 바꾸기"; });
    };
  };
  logoutAdmin = function(){ JIDB.signOut().then(function(){ adminLogin(); }); };
  /* 관리자 콘솔 전용 로그인 — 사이트 로그인과 따로 */
  window.adminLogin = function(msg){
    document.getElementById("root").innerHTML = '<div class="gate"><div class="box">' + LOGOMARK +
      '<h2>관리자 로그인</h2><p>관리자 콘솔은 사이트와 따로 로그인해요.</p>' +
      '<form id="al-f"><input id="al-e" type="email" placeholder="관리자 이메일" autocomplete="username" required>' +
      '<input id="al-p" type="password" placeholder="비밀번호" autocomplete="current-password" required>' +
      '<div class="err" id="al-err">' + esc(msg || "") + '</div>' +
      '<button class="btn primary block" type="submit">로그인</button></form>' +
      '<p style="margin:14px 0 0;text-align:center"><a href="' + SITE + 'index.html">사이트로 돌아가기</a></p></div></div>';
    document.getElementById("al-f").onsubmit = function(e){
      e.preventDefault();
      var b = this.querySelector("button"); b.disabled = true; b.textContent = "확인 중…";
      JIDB.call("login", { email: document.getElementById("al-e").value.trim(), pw: document.getElementById("al-p").value }).then(function(r){
        if (!r.user || (r.user.role !== "admin" && r.user.role !== "staff")) {
          // 관리자가 아니면 방금 만든 로그인은 바로 끝내고 저장하지 않음
          return fetch((window.SITE_CFG.apiUrl || "").replace(/\/?$/, "/") + "?a=logout", { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify({ _t: r.token }) })
            .catch(function(){}).then(function(){ throw new Error("관리자 계정이 아니에요."); });
        }
        JI.set("auth_admin", r.token);
        JI.set("session_admin", { id: r.user.id, email: r.user.email, nick: r.user.nick, region: r.user.region || "", role: r.user.role });
        document.getElementById("root").innerHTML = '<div class="gate"><div class="box">' + LOGOMARK + '<h2>불러오는 중…</h2></div></div>';
        return reloadAll();
      }).catch(function(err){ b.disabled = false; b.textContent = "로그인"; document.getElementById("al-err").textContent = err.message; });
    };
    setTimeout(function(){ var el = document.getElementById("al-e"); if (el) el.focus(); }, 50);
  };

  /* 서버에서 모두 불러와 브라우저 캐시에 채운 뒤 화면 그리기 */
  window.reloadAll = function(){
    return Promise.all([
      JIDB.syncFeed().then(function(changed){
        // 처음 여는 기기면 서버 설정(숨긴 글 등)을 반영하려고 한 번 새로 고침
        if (changed && !sessionStorage.getItem("ji_admin_synced")) { sessionStorage.setItem("ji_admin_synced", "1"); location.reload(); }
      }),
      JIDB.call("admin_overview").then(function(r){ STATS = r; }),
      JIDB.call("admin_inquiries").then(function(l){ _set.call(JI, "inquiries", l.reverse()); }),
      (isBoss() ? JIDB.call("admin_sellers") : Promise.resolve([])).then(function(l){   // 판매자 승인은 관리자만
        _set.call(JI, "seller_requests", l.reverse().map(function(r){
          var det = r.details && typeof r.details === "object" ? Object.keys(r.details).filter(function(k){ return k.charAt(0) !== "_" && r.details[k] !== ""; }).map(function(k){ return k + ": " + r.details[k]; }).join("\n") : "";
          return { id: r.id, board: r.board, nick: r.applicant_nick, email: r.email, region: r.region, status: r.status, uid: r.applicant,
            date: (r.created_at || "").slice(0, 16).replace("T", " "), details: r.details && typeof r.details === "object" ? r.details : null, note: r.message || "",
            message: (det ? det + "\n" : "") + (r.message || "") };
        }));
      }),
      JIDB.call("admin_users").then(function(l){ USERS = l; })
    ]).then(function(){ boot(); clearAdminBadge(); });
  };

  JIDB.ready.then(function(){
    var u = JIDB.me();
    if (!u) { adminLogin(); return; }
    if (u.role !== "admin" && u.role !== "staff") { JIDB.signOut().then(function(){ adminLogin("관리자 계정이 아니에요."); }); return; }
    document.getElementById("root").innerHTML = '<div class="gate"><div class="box">' + LOGOMARK + '<h2>불러오는 중…</h2></div></div>';
    reloadAll().catch(function(e){ alert("관리자 데이터를 불러오지 못했어요: " + e.message); });
  });
  /* 앱 아이콘의 숫자 — 콘솔을 열거나 다시 보면 운영 알림을 확인한 것으로 처리하고 숫자를 다시 맞춤 (새 문의는 콘솔 안 주황 표시로 계속 보임) */
  function clearAdminBadge(){
    return JIDB.call("noti_read_admin").catch(function(){}).then(function(){ if (JIDB.refreshUnread) JIDB.refreshUnread(); });
  }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && JIDB.me()) clearAdminBadge(); });
} else {
  if (sessionStorage.getItem("ji_admin_ok") === "1") boot(); else gate();
}
</script>
</body>
</html>
