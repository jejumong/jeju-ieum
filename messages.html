<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쪽지함 — 제주이음</title>
<!--og--><meta property="og:type" content="website"><meta property="og:site_name" content="제주이음"><meta property="og:title" content="쪽지함 — 제주이음"><meta property="og:description" content="제주에 살고 있거나 살아보려는 사람들을 위한 생활 정보와 동네 커뮤니티. 가이드·한달살기·학교 연계 집·부동산·오일장 달력."><meta property="og:url" content="https://jejuieum.com/messages.html"><meta property="og:image" content="https://jejuieum.com/assets/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="ko_KR"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="noindex"><!--/og-->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261110k">
</head>
<body data-active="">

<main class="wrap" style="max-width:860px;padding-top:28px">
  <div class="crumb"><a href="index.html">홈</a> › <a href="profile.html">내 정보</a> › 쪽지함</div>
  <h1 class="hp-h1">✉️ 쪽지함</h1>

  <div class="sh-tabs act-tabs" role="tablist" id="m-tabs">
    <button type="button" data-t="in" class="on"><span class="st-i">📥</span><span class="st-t"><b>받은 쪽지 <small id="n-in"></small></b></span></button>
    <button type="button" data-t="sent"><span class="st-i">📤</span><span class="st-t"><b>보낸 쪽지</b></span></button>
    <button type="button" data-t="write"><span class="st-i">✏️</span><span class="st-t"><b>쪽지 쓰기</b></span></button>
  </div>

  <section class="act-panel on" id="p-in"><div class="act-list" id="l-in"></div></section>
  <section class="act-panel" id="p-sent"><div class="act-list" id="l-sent"></div></section>
  <section class="act-panel" id="p-write">
    <div class="msg-form">
      <label for="m-to">받는 사람 (닉네임)</label>
      <input id="m-to" type="text" maxlength="20" placeholder="예: 한동리이웃" autocomplete="off">
      <label for="m-body">내용</label>
      <textarea id="m-body" maxlength="2000" rows="7" placeholder="이웃에게 보낼 내용을 적어 주세요. 연락처를 주고받을 때는 조심해 주세요."></textarea>
      <div class="msg-form-foot"><span id="m-len">0 / 2000</span><button type="button" class="btn primary" id="m-send">보내기</button></div>
    </div>
  </section>
</main>

<script src="assets/common.js?v=20261110k"></script>
<script src="assets/db.js?v=20261110k"></script>
<script src="assets/notify.js?v=20261110k"></script>
<script>
(function(){
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  function when(t){ var d = new Date(t); return (d.getMonth()+1) + "." + d.getDate() + " " + d.toTimeString().slice(0,5); }
  var empty = function(t){ return '<div class="act-empty">' + t + '</div>'; };
  var P = new URLSearchParams(location.search), TO_ID = P.get("to_id") || "";
  var BOX = { "in": [], sent: [] }, MSEL = {};
  function selBar(p, sel, total){
    var r = $(p + "-read"), al = $(p + "-all"); if (!r) return;
    r.disabled = !sel; r.textContent = sel ? "선택한 " + sel + "개 읽음으로 표시" : "선택한 읽음으로 표시";
    if (al) { al.checked = sel > 0 && sel === total; al.indeterminate = sel > 0 && sel < total; }
  }
  function readMsgs(ids){
    return JIDB.call("msg_read_many", { ids: ids }).then(function(){ BOX["in"].forEach(function(m){ if (ids.indexOf(m.id) > -1) m.read = true; }); MSEL = {}; draw("in"); JIDB.refreshUnread(); });
  }

  if (!JIDB.enabled) { document.querySelector("main").insertAdjacentHTML("beforeend", empty("회원 시스템 준비 중이에요.")); $("m-tabs").style.display = "none"; return; }

  function show(t){
    document.querySelectorAll("#m-tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === t); });
    document.querySelectorAll(".act-panel").forEach(function(p){ p.classList.toggle("on", p.id === "p-" + t); });
    if (t === "write") setTimeout(function(){ ($("m-to").value ? $("m-body") : $("m-to")).focus(); }, 50);
  }
  $("m-tabs").addEventListener("click", function(e){ var b = e.target.closest("button[data-t]"); if (b) show(b.dataset.t); });

  function compose(nick, id, quote){
    $("m-to").value = nick || ""; TO_ID = id || "";
    $("m-body").value = quote ? "\n\n----- 받은 쪽지 -----\n" + quote : "";
    $("m-len").textContent = $("m-body").value.length + " / 2000";
    show("write"); $("m-body").setSelectionRange(0, 0);
  }
  $("m-to").addEventListener("input", function(){ TO_ID = ""; });
  $("m-body").addEventListener("input", function(){ $("m-len").textContent = this.value.length + " / 2000"; });

  function item(m, box){
    var who = box === "in" ? m.from_nick : m.to_nick, op = m.from_nick === "제주이음" || m.from_nick === "제주이음 운영자";
    return '<div class="act-item msg-item' + (box === "in" ? " sel-item" : "") + (box === "in" && !m.read ? " unread" : "") + (op ? " msg-op" : "") + '" data-id="' + m.id + '" data-box="' + box + '">' +
      (box === "in" ? '<input type="checkbox" class="mk" data-id="' + m.id + '"' + (MSEL[m.id] ? ' checked' : '') + ' aria-label="선택">' : '') + '<div class="sel-main"><div class="ai-t"><b>' + (box === "in" ? "" : "→ ") + esc(who) + (op ? ' <span class="msg-badge">운영자</span>' : '') + '</b><span>' + when(m.created_at) + (box === "sent" ? (m.read ? " · 읽음" : " · 안 읽음") : "") + '</span></div>' +
      '<p class="msg-prev">' + esc(m.body.split("\n")[0].slice(0, 80)) + '</p>' +
      '<div class="msg-full" hidden><p class="msg-body">' + esc(m.body) + '</p><div class="ai-btns">' +
        (box === "in" ? '<button type="button" class="btn primary" data-reply="' + m.id + '">답장</button>' : '') +
        '<button type="button" class="btn ghost" data-del="' + m.id + '">삭제</button></div></div></div></div>';
  }
  function draw(box){
    var l = BOX[box];
    if (box === "in") { var n = l.filter(function(m){ return !m.read; }).length; $("n-in").textContent = n || ""; }
    var sel = Object.keys(MSEL).length, un = l.filter(function(m){ return !m.read; }).length;
    var bar = box === "in" && l.length ? '<div class="sel-bar"><label><input type="checkbox" id="mk-all"' + (sel && sel === l.length ? ' checked' : '') + '> 전체 선택</label>' +
      '<button type="button" class="btn ghost" id="mk-read"' + (sel ? '' : ' disabled') + '>' + (sel ? '선택한 ' + sel + '개 읽음으로 표시' : '선택한 읽음으로 표시') + '</button>' +
      '<button type="button" class="btn ghost" id="mk-allread"' + (un ? '' : ' disabled') + '>모두 읽음</button></div>' : '';
    $("l-" + box).innerHTML = l.length ? bar + l.map(function(m){ return item(m, box); }).join("")
      : empty(box === "in" ? "받은 쪽지가 없어요." : "보낸 쪽지가 없어요. 글쓴이 이름 옆 <b>✉️ 쪽지</b> 버튼이나 '쪽지 쓰기'로 보낼 수 있어요.");
  }
  function load(box){ return JIDB.messages(box).then(function(l){ BOX[box] = l; draw(box); }); }

  function open(el){
    var id = el.dataset.id, box = el.dataset.box, m = BOX[box].filter(function(x){ return x.id === id; })[0]; if (!m) return;
    var who = box === "in" ? m.from_nick : m.to_nick;
    jiModal('<div class="jm-h">' + (box === "in" ? "✉️ " + esc(who) + "님이 보낸 쪽지" : "📤 " + esc(who) + "님에게 보낸 쪽지") + '</div>' +
      '<div class="jm-meta">' + when(m.created_at) + (box === "sent" ? (m.read ? " · 읽음" : " · 안 읽음") : "") + '</div>' +
      '<div class="jm-body">' + esc(m.body) + '</div><div class="jm-btns">' +
      (box === "in" ? '<button type="button" class="btn primary" data-reply="' + m.id + '">답장</button>' : '') +
      '<button type="button" class="btn ghost" data-del="' + m.id + '">삭제</button><button type="button" class="btn ghost" onclick="jiModalClose()">닫기</button></div>');
    var opening = true;
    if (opening && box === "in" && m && !m.read) {
      JIDB.readMessage(id).then(function(){ m.read = true; el.classList.remove("unread"); var n = BOX["in"].filter(function(x){ return !x.read; }).length; $("n-in").textContent = n || "";
        JIDB.refreshUnread(); });
    }
  }
  document.addEventListener("click", function(e){ if (!e.target.closest("#jm-ov")) return;   // 창 안의 답장·삭제 버튼
    var r = e.target.closest("[data-reply]"), d = e.target.closest("[data-del]");
    if (r) { jiModalClose(); var m = BOX["in"].filter(function(x){ return x.id === r.dataset.reply; })[0]; if (m) compose(m.from_nick, m.from, m.body); }
    if (d) { if (!confirm("이 쪽지를 삭제할까요?")) return; jiModalClose(); JIDB.deleteMessage(d.dataset.del).then(function(){ load("in"); load("sent"); }); }
  });
  document.querySelector("main").addEventListener("click", function(e){
    var r = e.target.closest("[data-reply]"), d = e.target.closest("[data-del]");
    if (r) { var m = BOX["in"].filter(function(x){ return x.id === r.dataset.reply; })[0]; if (m) compose(m.from_nick, m.from, m.body); return; }
    if (d) {
      if (!confirm("이 쪽지를 삭제할까요?")) return;
      JIDB.deleteMessage(d.dataset.del).then(function(){ load("in"); load("sent"); }); return;
    }
    if (e.target.id === "mk-read") return readMsgs(Object.keys(MSEL));
    if (e.target.id === "mk-allread") return readMsgs(BOX["in"].filter(function(m){ return !m.read; }).map(function(m){ return m.id; }));
    var it = e.target.closest(".msg-item"); if (it && !e.target.closest("button") && !e.target.closest("input")) open(it);
  });

  $("l-in").addEventListener("change", function(e){
    var t = e.target;
    if (t.classList.contains("mk")) { if (t.checked) MSEL[t.dataset.id] = 1; else delete MSEL[t.dataset.id]; }
    if (t.id === "mk-all") { MSEL = {}; if (t.checked) BOX["in"].forEach(function(m){ MSEL[m.id] = 1; }); document.querySelectorAll("#l-in .mk").forEach(function(c){ c.checked = t.checked; }); }
    selBar("mk", Object.keys(MSEL).length, BOX["in"].length);   // 목록은 다시 그리지 않고 위 버튼만 바꿈 (열어 둔 쪽지 유지)
  });
  $("m-send").onclick = function(){
    var to = $("m-to").value.trim(), body = $("m-body").value.trim();
    if (!to) { alert("받는 사람 닉네임을 적어 주세요."); $("m-to").focus(); return; }
    if (!body) { alert("내용을 적어 주세요."); $("m-body").focus(); return; }
    var btn = this; btn.disabled = true;
    JIDB.sendMessage(TO_ID || to, body).then(function(){
      btn.disabled = false; $("m-body").value = ""; $("m-len").textContent = "0 / 2000";
      alert(to + "님에게 쪽지를 보냈어요."); load("sent").then(function(){ show("sent"); });
    }, function(e){ btn.disabled = false; alert(e.message || e); });
  };

  JIDB.ready.then(function(){
    if (!JIDB.me()) { location.href = "login.html?next=" + encodeURIComponent("messages.html" + location.search); return; }
    Promise.all([load("in"), load("sent")]).then(function(){
      var o = P.get("open"); if (o) { var el = document.querySelector('.msg-item[data-id="' + o + '"]'); if (el) { open(el); el.scrollIntoView({ block: "center" }); } }
    });
    if (P.get("to") || TO_ID) compose(P.get("to") || "", TO_ID);
  });
})();
</script>
</body>
</html>
