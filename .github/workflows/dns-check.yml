name: 도메인 DNS 확인
on:
  push:
    paths: [".github/workflows/dns-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in ns1.cafe24.com ns2.cafe24.com ns1.cafe24.co.kr ns2.cafe24.co.kr; do echo "## $n"; dig +short +tcp @$n jejuieum.com TXT; echo "b1:"; dig +short @$n brevo1._domainkey.jejuieum.com CNAME; echo "b2:"; dig +short @$n brevo2._domainkey.jejuieum.com CNAME; echo "dm:"; dig +short @$n _dmarc.jejuieum.com TXT; done
          for s in ns1.cafe24.com 8.8.8.8; do
            echo "=== $s"
            echo "-- TXT root"; dig +short @$s jejuieum.com TXT
            echo "-- brevo1"; dig +short @$s brevo1._domainkey.jejuieum.com CNAME
            echo "-- brevo2"; dig +short @$s brevo2._domainkey.jejuieum.com CNAME
            echo "-- dmarc"; dig +short @$s _dmarc.jejuieum.com TXT
            echo "-- zmail"; dig +short @$s zmail._domainkey.jejuieum.com TXT | cut -c1-40
            echo "-- MX"; dig +short @$s jejuieum.com MX
            echo "-- A"; dig +short @$s jejuieum.com A; dig +short @$s www.jejuieum.com
            echo "-- wildcard"; dig +short @$s zzz.jejuieum.com
          done
