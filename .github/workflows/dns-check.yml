name: 도메인 DNS 확인
on:
  push:
    paths: [".github/workflows/dns-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== A"; dig +short jejuieum.com A; dig +short www.jejuieum.com
          for u in http://jejuieum.com/ https://jejuieum.com/ https://www.jejuieum.com/ https://jeju.hintdaily.com/ https://jejuieum.com/jangnal.html; do
            echo "== $u"; curl -sS -o /dev/null -m 20 -w "%{http_code} -> %{redirect_url}\n" "$u" || true; done
          echo "== cert"; echo | openssl s_client -connect jejuieum.com:443 -servername jejuieum.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
          echo "== api cors"; curl -sS -m 20 -D - -o /tmp/b -H "Origin: https://jejuieum.com" -H "Content-Type: text/plain" --data '{}' "https://andend07.mycafe24.com/jeju/api/?a=ping" | grep -i "access-control-allow-origin\|HTTP/"; cat /tmp/b; echo
# run 2
