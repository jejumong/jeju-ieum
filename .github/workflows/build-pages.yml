# 데이터(가이드·학교 연계 집·지원 프로그램)나 화면 파일이 바뀌면
# 검색용 개별 페이지(guide/, house/, program/)와 sitemap.xml 을 다시 만들어 올립니다.
name: build-search-pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "guide/**"
      - "house/**"
      - "program/**"
      - "sitemap.xml"
      - "robots.txt"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-search-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-pages.mjs
      - name: 바뀐 페이지 올리기
        run: |
          git add guide house program sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "바뀐 페이지 없음"; exit 0; fi
          git config user.name "jeju-ieum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "검색용 페이지 자동 갱신"
          git pull --rebase origin main
          git push
