<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 알림·가입 신청 — 제주이음</title>
<!--og--><meta property="og:type" content="website"><meta property="og:site_name" content="제주이음"><meta property="og:title" content="내 알림·가입 신청 — 제주이음"><meta property="og:description" content="제주에 살고 있거나 살아보려는 사람들을 위한 생활 정보와 동네 커뮤니티. 가이드·한달살기·학교 연계 집·부동산·오일장 달력."><meta property="og:url" content="https://jejuieum.com/activity.html"><meta property="og:image" content="https://jejuieum.com/assets/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="ko_KR"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="noindex"><!--/og-->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261111r">
</head>
<body data-active="">

<main class="wrap" style="max-width:860px;padding-top:28px">
  <div class="crumb"><a href="index.html">홈</a> › <a href="profile.html">내 정보</a> › 내 알림</div>
  <h1 class="hp-h1">내 알림 · 가입 신청</h1>

  <div class="act-push" id="act-push"></div>

  <div class="sh-tabs act-tabs" role="tablist" id="act-tabs">
    <button type="button" data-t="noti" class="on"><span class="st-i">🔔</span><span class="st-t"><b>알림 <small id="n-noti"></small></b></span></button>
    <button type="button" data-t="received"><span class="st-i">📥</span><span class="st-t"><b>받은 가입 신청 <small id="n-received"></small></b></span></button>
    <button type="button" data-t="sent"><span class="st-i">📤</span><span class="st-t"><b>보낸 신청 <small id="n-sent"></small></b></span></button>
  </div>

  <section class="act-panel on" id="p-noti"><div class="act-list" id="l-noti"></div></section>
  <section class="act-panel" id="p-received"><div class="act-list" id="l-received"></div></section>
  <section class="act-panel" id="p-sent"><div class="act-list" id="l-sent"></div></section>
</main>

<script src="assets/common.js?v=20261111r"></script>
<script src="assets/db.js?v=20261111r"></script>
<script src="assets/notify.js?v=20261111r"></script>
<script>
(function(){
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  function when(t){ var d = new Date(t); return (d.getMonth()+1) + "." + d.getDate() + " " + d.toTimeString().slice(0,5); }
  var empty = function(t){ return '<div class="act-empty">' + t + '</div>'; };

  if (!JIDB.enabled) {
    document.querySelector("main").insertAdjacentHTML("beforeend", empty("회원 시스템 준비 중이에요. 곧 열려요."));
    $("act-tabs").style.display = "none"; return;
  }

  // 탭
  function show(t){
    document.querySelectorAll("#act-tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === t); });
    document.querySelectorAll(".act-panel").forEach(function(p){ p.classList.toggle("on", p.id === "p-" + t); });
    history.replaceState(null, "", "#" + t);
  }
  $("act-tabs").addEventListener("click", function(e){ var b = e.target.closest("button[data-t]"); if (b) show(b.dataset.t); });
  var h = (location.hash || "").slice(1); if (["noti","received","sent"].indexOf(h) > -1) show(h);

  JIDB.ready.then(function(){
    var u = JIDB.me();
    if (!u) { location.href = "login.html?next=" + encodeURIComponent("activity.html" + location.hash); return; }

    // 휴대폰 알림 켜기
    function drawPush(){
      var box = $("act-push");
      if (!JINotify.pushSupported()) { box.innerHTML = ""; return; }
      if (JINotify.accountPushOn()) {
        box.innerHTML = '<div class="act-push-on">📱 이 기기에서 가입 신청·결과 알림을 받고 있어요.</div>';
        JINotify.linkAccount(); return;
      }
      box.innerHTML = '<div class="act-push-box"><div><b>📱 휴대폰으로도 알림 받기</b><span>가입 신청이 오거나 결과가 나오면 이 기기로 바로 알려 드려요. (무료)' +
        (JINotify.isIOSBrowser() ? ' 아이폰은 Safari 공유 버튼 → <b>홈 화면에 추가</b> 후 그 아이콘으로 열어야 받을 수 있어요.' : '') + '</span></div>' +
        '<button type="button" class="btn primary" id="push-on">알림 켜기</button></div>';
      $("push-on").onclick = function(){ JINotify.enableAccountPush().then(function(r){ if (r.denied) alert("브라우저에서 알림이 차단돼 있어요. 주소창 왼쪽 자물쇠 → 알림 → 허용으로 바꿔 주세요."); drawPush(); }); };
    }
    drawPush();

    // 알림
    var NOTI = [], NSEL = {};
    function drawNoti(){
      var other = NOTI.filter(function(n){ return !n.read && n.kind !== "join_request"; }).length;   // 가입 신청 알림은 '받은 가입 신청' 탭 숫자로
      $("n-noti").textContent = other || "";
      var unread = NOTI.filter(function(n){ return !n.read; }).length, sel = Object.keys(NSEL).length;
      $("l-noti").innerHTML = NOTI.length ? '<div class="sel-bar"><label><input type="checkbox" id="nk-all"' + (sel && sel === NOTI.length ? ' checked' : '') + '> 전체 선택</label>' +
          '<button type="button" class="btn ghost" id="nk-read"' + (sel ? '' : ' disabled') + '>' + (sel ? '선택한 ' + sel + '개 읽음으로 표시' : '선택한 읽음으로 표시') + '</button>' +
          '<button type="button" class="btn ghost" id="nk-allread"' + (unread ? '' : ' disabled') + '>모두 읽음</button></div>' +
        NOTI.map(function(n){
          return '<div class="act-item sel-item' + (n.read ? "" : " unread") + '"><input type="checkbox" class="nk" data-id="' + n.id + '"' + (NSEL[n.id] ? ' checked' : '') + ' aria-label="선택">' +
            '<a class="sel-main" data-nid="' + n.id + '" href="' + esc(n.link || "#") + '"><div class="ai-t"><b>' + esc(n.title) + '</b><span>' + when(n.created_at) + '</span></div><p>' + esc(n.body) + '</p></a></div>';
        }).join("") : empty("아직 알림이 없어요.");
    }
    function readNoti(ids){
      return JIDB.call("noti_read", { ids: ids }).then(function(){ NOTI.forEach(function(n){ if (ids.indexOf(n.id) > -1) n.read = true; }); NSEL = {}; drawNoti(); JIDB.refreshUnread(); });
    }
    $("l-noti").addEventListener("change", function(e){
      var t = e.target;
      if (t.classList.contains("nk")) { if (t.checked) NSEL[t.dataset.id] = 1; else delete NSEL[t.dataset.id]; }
      if (t.id === "nk-all") { NSEL = {}; if (t.checked) NOTI.forEach(function(n){ NSEL[n.id] = 1; }); document.querySelectorAll("#l-noti .nk").forEach(function(c){ c.checked = t.checked; }); }
      var sel = Object.keys(NSEL).length, r = $("nk-read"), al = $("nk-all");
      r.disabled = !sel; r.textContent = sel ? "선택한 " + sel + "개 읽음으로 표시" : "선택한 읽음으로 표시";
      al.checked = sel > 0 && sel === NOTI.length; al.indeterminate = sel > 0 && sel < NOTI.length;
    });
    $("l-noti").addEventListener("click", function(e){
      if (e.target.id === "nk-read") return readNoti(Object.keys(NSEL));
      if (e.target.id === "nk-allread") return JIDB.markAllRead().then(function(){ NOTI.forEach(function(n){ n.read = true; }); NSEL = {}; drawNoti(); JIDB.refreshUnread(); });
      var a = e.target.closest("a[data-nid]"); if (!a) return;
      e.preventDefault();
      var n = NOTI.filter(function(x){ return x.id === a.dataset.nid; })[0]; if (!n) return;   // 누르면 창으로 내용 보기 + 읽음
      var href = n.link && n.link !== "#" ? n.link : "";
      jiModal('<div class="jm-h">' + esc(n.title) + '</div><div class="jm-meta">' + when(n.created_at) + '</div>' +
        (n.body ? '<div class="jm-body">' + esc(n.body) + '</div>' : '') +
        '<div class="jm-btns">' + (href ? '<a class="btn primary" href="' + esc(href) + '">바로 가기 →</a>' : '') + '<button type="button" class="btn ghost" onclick="jiModalClose()">닫기</button></div>');
      if (!n.read) JIDB.call("noti_read", { ids: [n.id] }).then(function(){ n.read = true; drawNoti(); JIDB.refreshUnread(); }).catch(function(){});
    });
    JIDB.notifications().then(function(list){ NOTI = list; drawNoti(); });

    // 받은 가입 신청 (내가 만든 모임)
    function drawReceived(){
      JIDB.receivedJoins().then(function(list){
        var pend = list.filter(function(j){ return j.status === "pending"; }).length;
        $("n-received").textContent = pend || "";
        $("l-received").innerHTML = list.length ? list.map(function(j){
          var st = { pending: "대기", approved: "승인함", rejected: "거절함" }[j.status];
          return '<div class="act-item join s-' + j.status + '"><div class="ai-t"><b>' + esc(j.applicant_nick) + '</b><span>' + when(j.created_at) + '</span></div>' +
            '<div class="ai-club">🏄 <a href="view.html?id=' + j.club_id + '">' + esc(j.club_title) + '</a></div>' +
            (j.message ? '<p class="ai-msg">“' + esc(j.message) + '”</p>' : '') +
            (j.status === "pending"
              ? '<div class="ai-btns"><button type="button" class="btn primary" data-ok="' + j.id + '">승인</button><button type="button" class="btn ghost" data-no="' + j.id + '">거절</button></div>'
              : '<div class="ai-st">' + st + '</div>') + '</div>';
        }).join("") : empty("아직 받은 가입 신청이 없어요. 모임을 만들면 신청이 여기로 와요.<br><a href=\"write.html?board=%EB%8F%99%ED%98%B8%ED%9A%8C\">모임 만들기 →</a>");
      });
    }
    $("l-received").addEventListener("click", function(e){
      var b = e.target.closest("button[data-ok],button[data-no]"); if (!b) return;
      var ok = !!b.dataset.ok, jid = b.dataset.ok || b.dataset.no;
      if (!ok && !confirm("이 신청을 거절할까요? 신청자에게 결과 알림이 가요.")) return;
      b.disabled = true;
      JIDB.decideJoin(jid, ok ? "approved" : "rejected").then(drawReceived, function(e){ alert("처리하지 못했어요: " + (e.message || e)); drawReceived(); });
    });
    drawReceived();

    // 보낸 신청
    JIDB.sentJoins().then(function(list){
      $("n-sent").textContent = list.length || "";
      $("l-sent").innerHTML = list.length ? list.map(function(j){
        var st = { pending: "⏳ 승인 대기 중", approved: "🎉 승인됨", rejected: "함께하기 어려움" }[j.status];
        return '<a class="act-item join s-' + j.status + '" href="view.html?id=' + j.club_id + '"><div class="ai-t"><b>' + esc(j.club_title) + '</b><span>' + when(j.created_at) + '</span></div><div class="ai-st">' + st + '</div></a>';
      }).join("") : empty("아직 신청한 모임이 없어요. <a href=\"clubs.html\">동호회 둘러보기 →</a>");
    });
  });
})();
</script>
</body>
</html>
