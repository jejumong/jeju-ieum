<meta name="description" content="제주 물때 시간표, 열두 달 달력, 내 근처 찾기를 제주이음 안에서 바로 쓰세요.">

<body data-active="tools">

<main class="wrap tl-wrap">
  <div class="tl-frame-box"><iframe id="tl-frame" scrolling="no" title="생활도구" allow="geolocation; clipboard-write" loading="eager"></iframe></div>
</main>

<script src="assets/common.js?v=20261109w"></script>
<script src="assets/db.js?v=20261109w"></script>
<script src="assets/notify.js?v=20261109w"></script>
<script>
(function(){
  /* 생활도구는 각자 다른 저장소(jejumong.github.io/…)에 있고, 여기서는 틀(iframe)에 넣어 보여 줍니다.
     도구 페이지는 틀 안에서 열리면 '제주몽 홈' 버튼을 스스로 숨깁니다. */
  var TOOLS = [
    { k: "cal",  ico: "🗓️", name: "열두 달 달력", url: SITE_CFG.tools.calendar },
    { k: "near", ico: "📍", name: "내 근처 찾기", url: SITE_CFG.tools.near },
    { k: "tide", ico: "🌊", name: "물때 시간표", url: SITE_CFG.tools.tide }
  ];
  var cur = new URLSearchParams(location.search).get("t") || "cal";
  var t = TOOLS.filter(function(x){ return x.k === cur; })[0] || TOOLS[0];
  document.title = t.name + " — 제주이음";
  var f = document.getElementById("tl-frame");
  f.title = t.name;
  f.src = t.url + (t.url.indexOf("?") > -1 ? "&" : "?") + "embed=1&v=20261105l";
  /* 도구 페이지가 알려 주는 내용 높이에 맞춰 틀 높이 조절 → 페이지 전체가 한 번에 스크롤 */
  var toolOrigin = new URL(t.url).origin;
  window.addEventListener("message", function(e){
    if (e.origin !== toolOrigin && toolOrigin.indexOf("localhost") < 0) return;
    var h = e.data && +e.data.jjmHeight;
    if (h > 200 && h < 30000) { f.style.height = Math.ceil(h) + "px"; f.classList.add("fit"); }
  });
})();
</script>
</body>
</html>
