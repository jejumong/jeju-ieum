<body data-active="guide">

<main class="wrap gd">
  <div class="gd-top">
    <div class="crumb"><a href="index.html">홈</a> › 제주살이 가이드</div>
    <h1 id="g-title">제주살이 가이드</h1>
    <p>지금 상황을 고르면 꼭 필요한 글만 보여 드려요.</p>
    <form class="gd-search" onsubmit="return false">
      <input id="gq" type="search" placeholder="궁금한 걸 검색해 보세요 (예: 습기, 학교, 생활비)" autocomplete="off">
    </form>
  </div>

  <nav class="gd-stages" id="gd-stages" aria-label="상황 선택"></nav>

  <div id="search-note"></div>

  <h2 class="gd-h" id="list-h">모든 가이드</h2>
  <div class="gd-list gd-grid" id="gd-list"></div>

  <div class="gd-ask">
    <div><b>찾는 내용이 없나요?</b><span>궁금한 주제를 알려 주시면 다음 가이드로 정리해요. 이웃에게 바로 물어봐도 좋아요.</span></div>
    <div class="gd-ask-btns">
      <a class="btn ghost" href="community.html">이웃에게 묻기</a>
      <a class="btn primary" href="contact.html?type=%EA%B0%80%EC%9D%B4%EB%93%9C%20%EC%A3%BC%EC%A0%9C%20%EC%A0%9C%EC%95%88">주제 제안하기</a>
    </div>
  </div>
</main>

<script src="assets/common.js?v=20261114c"></script>
<script src="assets/db.js?v=20261114c"></script>
<script src="assets/notify.js?v=20261114c"></script>
<script src="assets/seed-trade.js?v=20261114c"></script>
<script src="assets/seed-extra.js?v=20261114c"></script>
<script src="assets/festivals-data.js?v=20261114c"></script>
<script src="assets/seed-new.js?v=20261114c"></script>
<script src="assets/admin-data.js?v=20261114c"></script>
<script src="assets/guide-data.js?v=20261114c"></script>
<script>
(function(){
  var P = new URLSearchParams(location.search);
  var stage = P.get("stage") || "", cat = P.get("cat") || "", q = (P.get("q") || "").trim();
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  var STAGE_ICO = { "": "📚", "고민": "🤔", "한달살기": "🧳", "정착": "📦", "도민": "🏠" };

  // 상황 선택
  function stageUrl(id){ return "guide.html" + (id ? "?stage=" + encodeURIComponent(id) : ""); }
  var stages = [{ id:"", label:"전체", sub:"모든 가이드" }].concat(GUIDE_STAGES);
  $("gd-stages").innerHTML = stages.map(function(s){
    var n = s.id ? GUIDES.filter(function(g){ return (g.stage||[]).indexOf(s.id) > -1; }).length : GUIDES.length;
    return '<a href="' + stageUrl(s.id) + '" class="' + (stage === s.id && !cat && !q ? "on" : "") + '">' +
      '<span class="s-ico">' + STAGE_ICO[s.id] + '</span>' + s.label + ' <small>' + n + '</small></a>';
  }).join("");


  // 목록
  var list = GUIDES.filter(function(g){
    if (stage && (g.stage||[]).indexOf(stage) < 0) return false;
    if (cat && g.cat !== cat) return false;
    if (q && guideText(g).toLowerCase().indexOf(q.toLowerCase()) < 0) return false;
    return true;
  });
  // 전체 보기에서는 '처음이라면 이 순서로' 4편을 맨 앞에 번호와 함께
  var first = {};
  if (!stage && !cat && !q) {
    GUIDE_PATH.forEach(function(x, i){ first[x.id] = i + 1; });
    list.sort(function(a, b){ return (first[a.id] || 99) - (first[b.id] || 99); });
  }

  var st = GUIDE_STAGES.filter(function(s){ return s.id === stage; })[0];
  if (st) { $("g-title").textContent = st.label + "이라면"; $("list-h").textContent = st.label + " — 가이드 " + list.length + "편"; }
  else if (cat) { $("g-title").textContent = cat; $("list-h").textContent = cat + " — 가이드 " + list.length + "편"; }
  else $("list-h").textContent = "모든 가이드 " + list.length + "편";

  if (q) {
    $("g-title").textContent = "‘" + q + "’ 검색 결과";
    $("gq").value = q;
    $("list-h").textContent = "가이드 " + list.length + "편";
    // 커뮤니티·생활장터 글도 함께 검색 (서버 글이 늦게 도착하면 다시 그림)
    var drawPosts = function(){
      var ql = q.toLowerCase();
      var hits = allPosts().filter(function(p){
        if (p.board === "공지") return false;
        return ((p.title||"") + " " + (p.content||"") + " " + (p.board||"")).toLowerCase().indexOf(ql) > -1;
      }).sort(function(a, b){ return (a.date||"") < (b.date||"") ? 1 : -1; });
      var ns = (typeof noticesFor === "function" ? noticesFor(null) : []).filter(function(n){ return ((n.title||"") + " " + (n.content||"")).toLowerCase().indexOf(ql) > -1; });
      hits = ns.concat(hits);
      $("search-note").innerHTML = hits.length
        ? '<section class="sr-posts"><div class="sr-h"><b>커뮤니티·생활장터 글 ' + hits.length + '건</b>' +
            (hits.length > 6 ? '<a href="community.html?q=' + encodeURIComponent(q) + '">전체 보기 →</a>' : '') + '</div>' +
            hits.slice(0, 6).map(function(p){
              return '<a class="sr-row" href="view.html?id=' + encodeURIComponent(p.id) + '"><span class="sr-b">' + esc(p.board || "공지") + '</span>' +
                '<span class="sr-t">' + esc(p.title) + '</span><span class="sr-d">' + esc(typeof fmtDate === "function" ? fmtDate(p.date) : (p.date||"")) + '</span></a>';
            }).join("") + '</section>'
        : '<div class="search-note">커뮤니티·생활장터에는 ‘' + esc(q) + '’ 관련 글이 아직 없어요.</div>';
    };
    drawPosts();
    var prevOnData = window.onJIData;
    window.onJIData = function(){ if (typeof prevOnData === "function") prevOnData.apply(this, arguments); drawPosts(); };
  }

  $("gd-list").innerHTML = list.length ? list.map(function(g){
    var parts = g.title.split(" — ");
    var n = first[g.id];
    return '<a class="gd-card" href="guide/' + g.id + '.html">' +
      '<span class="c-ico">' + g.ico + '</span>' +
      '<span class="c-body">' +
        '<span class="c-cat">' + (n ? '<em class="c-first">처음이라면 ' + n + '번째</em>' : esc(g.cat)) + '</span>' +
        '<b>' + esc(parts[0]) + '</b>' +
        (parts[1] ? '<span class="c-sub">' + esc(parts[1]) + '</span>' : '') +
      '</span>' +
      '<span class="c-min">' + g.min + '분</span>' +
    '</a>';
  }).join("") : '<div class="gd-empty">이 조건의 가이드가 아직 없어요. 아래에서 주제를 제안해 주세요.</div>';

  $("gq").addEventListener("keydown", function(e){
    if (e.key === "Enter") { var v = this.value.trim(); location.href = "guide.html" + (v ? "?q=" + encodeURIComponent(v) : ""); }
  });
})();
</script>
</body>
</html>
