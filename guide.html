<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주살이 가이드 — 제주이음</title>
<meta name="description" content="제주 이주·한달살기·정착을 위한 생활 가이드. 동네 고르기, 계절 생활, 집 관리, 아이랑 제주, 일과 생활비까지 업데이트 날짜와 출처를 함께 적습니다.">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261105h">
</head>
<body data-active="guide">

<main class="wrap gd">
  <div class="gd-top">
    <div class="crumb"><a href="index.html">홈</a> › 제주살이 가이드</div>
    <h1 id="g-title">제주살이 가이드</h1>
    <p>지금 상황을 고르면 꼭 필요한 글만 보여 드려요. 글마다 어떤 내용이 들어 있는지 미리 볼 수 있어요.</p>
    <form class="gd-search" onsubmit="return false">
      <input id="gq" type="search" placeholder="궁금한 걸 검색해 보세요 (예: 습기, 학교, 생활비)" autocomplete="off">
    </form>
  </div>

  <nav class="gd-stages" id="gd-stages" aria-label="상황 선택"></nav>

  <div id="search-note"></div>

  <section id="gd-path-wrap">
    <h2 class="gd-h">처음이라면 이 순서로</h2>
    <ol class="hx-path" id="gd-path"></ol>
  </section>

  <h2 class="gd-h" id="list-h">모든 가이드</h2>
  <div class="gd-list" id="gd-list"></div>

  <div class="gd-ask">
    <div><b>찾는 내용이 없나요?</b><span>궁금한 주제를 알려 주시면 다음 가이드로 정리해요. 이웃에게 바로 물어봐도 좋아요.</span></div>
    <div class="gd-ask-btns">
      <a class="btn ghost" href="community.html">이웃에게 묻기</a>
      <a class="btn primary" href="contact.html?type=%EA%B0%80%EC%9D%B4%EB%93%9C%20%EC%A3%BC%EC%A0%9C%20%EC%A0%9C%EC%95%88">주제 제안하기</a>
    </div>
  </div>
</main>

<script src="assets/common.js?v=20261105h"></script>
<script src="assets/seed-trade.js?v=20261105h"></script>
<script src="assets/seed-extra.js?v=20261105h"></script>
<script src="assets/seed-new.js?v=20261105h"></script>
<script src="assets/admin-data.js?v=20261105h"></script>
<script src="assets/guide-data.js?v=20261105h"></script>
<script>
(function(){
  var P = new URLSearchParams(location.search);
  var stage = P.get("stage") || "", cat = P.get("cat") || "", q = (P.get("q") || "").trim();
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  var STAGE_ICO = { "": "📚", "고민": "🤔", "한달살기": "🧳", "정착": "📦", "도민": "🏠" };

  // 상황 선택
  function stageUrl(id){ return "guide.html" + (id ? "?stage=" + encodeURIComponent(id) : ""); }
  var stages = [{ id:"", label:"전체", sub:"모든 가이드" }].concat(GUIDE_STAGES);
  $("gd-stages").innerHTML = stages.map(function(s){
    var n = s.id ? GUIDES.filter(function(g){ return (g.stage||[]).indexOf(s.id) > -1; }).length : GUIDES.length;
    return '<a href="' + stageUrl(s.id) + '" class="' + (stage === s.id && !cat && !q ? "on" : "") + '">' +
      '<span class="s-ico">' + STAGE_ICO[s.id] + '</span><b>' + s.label + '</b><small>' + s.sub + ' · ' + n + '편</small></a>';
  }).join("");

  // 처음 읽는 순서 (전체 보기일 때만)
  if (!stage && !cat && !q) {
    $("gd-path").innerHTML = GUIDE_PATH.map(function(x, i){
      var g = guideById(x.id); if (!g) return "";
      return '<li><a href="article.html?id=' + g.id + '"><span class="p-n">' + (i+1) + '</span><span class="p-q">' + esc(x.q) + '</span>' +
        '<b>' + esc(g.title.split(" — ")[0]) + '</b><span class="p-m">' + g.min + '분 읽기</span></a></li>';
    }).join("");
  } else { $("gd-path-wrap").style.display = "none"; }

  // 목록
  var list = GUIDES.filter(function(g){
    if (stage && (g.stage||[]).indexOf(stage) < 0) return false;
    if (cat && g.cat !== cat) return false;
    if (q && guideText(g).toLowerCase().indexOf(q.toLowerCase()) < 0) return false;
    return true;
  });

  var st = GUIDE_STAGES.filter(function(s){ return s.id === stage; })[0];
  if (st) { $("g-title").textContent = st.label + "이라면"; $("list-h").textContent = st.label + " — 가이드 " + list.length + "편"; }
  else if (cat) { $("g-title").textContent = cat; $("list-h").textContent = cat + " — 가이드 " + list.length + "편"; }
  else $("list-h").textContent = "모든 가이드 " + list.length + "편";

  if (q) {
    $("g-title").textContent = "‘" + q + "’ 검색 결과";
    $("gq").value = q;
    $("list-h").textContent = "가이드 " + list.length + "편";
    var cm = allPosts().filter(function(p){ return ((p.title||"") + " " + (p.content||"")).indexOf(q) > -1; }).length;
    if (cm) $("search-note").innerHTML = '<div class="search-note">커뮤니티에도 관련 글이 ' + cm + '건 있어요 <a href="community.html?q=' + encodeURIComponent(q) + '">커뮤니티 결과 보기 →</a></div>';
  }

  $("gd-list").innerHTML = list.length ? list.map(function(g){
    var parts = g.title.split(" — ");
    var inside = (g.sections || []).map(function(s){ return s.h; }).slice(0, 3);
    return '<a class="gd-row" href="article.html?id=' + g.id + '">' +
      '<span class="r-ico">' + g.ico + '</span>' +
      '<span class="r-body">' +
        '<span class="r-cat">' + esc(g.cat) + '</span>' +
        '<b>' + esc(parts[0]) + '</b>' +
        (parts[1] ? '<span class="r-sub">' + esc(parts[1]) + '</span>' : '') +
        (inside.length ? '<span class="r-in"><em>이런 내용을 담았어요</em>' + inside.map(function(h){ return '<i>' + esc(h) + '</i>'; }).join("") + '</span>' : '') +
      '</span>' +
      '<span class="r-side"><span>' + g.min + '분</span><small>' + g.updated.slice(5).replace("-", ".") + ' 확인</small><span class="r-arr">›</span></span>' +
    '</a>';
  }).join("") : '<div class="gd-empty">이 조건의 가이드가 아직 없어요. 아래에서 주제를 제안해 주세요.</div>';

  $("gq").addEventListener("keydown", function(e){
    if (e.key === "Enter") { var v = this.value.trim(); location.href = "guide.html" + (v ? "?q=" + encodeURIComponent(v) : ""); }
  });
})();
</script>
</body>
</html>
