<script>


var META = {
  "ts1":{e:"🍞",star:"★ 4.9 (128)",perk:"회원 10%"},
  "ts2":{e:"🔧",star:"★ 4.8 (96)",perk:"첫 점검 무료"},
  "ts3":{e:"🐟",star:"★ 4.9 (204)",perk:"시세 공지"},
  "ts4":{e:"🩺",star:"★ 4.7 (73)",perk:"야간 진료"},
  "ts5":{e:"✏️",star:"★ 4.8 (41)",perk:"형제 할인"},
  "ts6":{e:"🌿",star:"★ 4.9 (58)",perk:"정기권 할인"},
  "ts7":{e:"☕",star:"★ 4.8 (87)",perk:"드립백 증정"},
  "ts8":{e:"🔥",star:"★ 4.7 (52)",perk:"출장비 무료"},
  "ts9":{e:"🦵",star:"★ 4.9 (34)",perk:"방문 상담"},
  "ts10":{e:"🏄",star:"★ 4.8 (61)",perk:"형제 할인"},
  "ts11":{e:"🥬",star:"★ 4.9 (45)",perk:"장바구니 할인"},
  "ts12":{e:"📦",star:"★ 4.6 (78)",perk:"사진 견적"}
};
var catFilter = "all";

function applyChip(el){
  el.parentElement.querySelectorAll(".chip-btn").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on");
  catFilter = el.dataset.filter;
  render();
}
function shopCard(p, isPm){
  var m = META[p.id] || { star: p.star, perk: p.perk };
  var isUser = isUserPost(p), isMine = isMyPost(p);
  return photoCard(p, { pm: isPm, badge: { text: p.head || "상점" }, title: p.title.split(" — ")[0],
    info: (m.star ? '<b class="star">' + escHtml(m.star) + '</b>' : '') + '<span>' + escHtml(p.loc || "") + '</span>' +
      (m.perk ? '<span class="perk">' + escHtml(m.perk) + '</span>' : ''),
    mine: isMine ? "내 글" : "" });
}
function render(){
  var list = userPostsOf("제주상점").concat(TRADE_SEEDS.filter(function(p){ return p.board === "제주상점"; }));
  list = list.filter(function(p){ return catFilter === "all" || (p.head || "") === catFilter; });
  document.getElementById("shown-count").textContent = list.length;
  renderSections({
    grid: document.getElementById("shop-wrap"),
    list: list,
    card: shopCard,
    emptyHtml: emptyInvite("제주상점", "상점")
  });
}
render();
</script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var btn = document.getElementById("shop-write-btn");
  if (btn && isApprovedSeller("제주상점")) btn.href = "write.html?board=제주상점";
});
window.onJIData = render;   // 서버에서 새 글을 받아오면 목록을 다시 그림
</script>
