<style>
/* ── 축제 지도 (이미지 + 점 오버레이) ── */
.map-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:24px;line-height:0;box-shadow:var(--sh-3)}
.map-wrap img{display:block;width:100%;height:auto}
.map-caption{position:absolute;left:18px;top:16px;font-size:13px;font-weight:700;line-height:1.4;color:var(--ink-2);background:rgba(255,255,255,.92);padding:7px 15px;border-radius:var(--r-pill);z-index:5;box-shadow:var(--sh-2);backdrop-filter:blur(4px)}
.map-legend{position:absolute;right:18px;top:16px;display:flex;gap:14px;font-size:12.5px;font-weight:600;line-height:1.4;color:var(--ink-2);background:rgba(255,255,255,.92);padding:7px 16px;border-radius:var(--r-pill);z-index:5;box-shadow:var(--sh-2);backdrop-filter:blur(4px)}
.map-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

.fest-dot{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;padding:0;z-index:6}
.fest-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:inherit;opacity:.6;animation:pulse 2s ease-out infinite;z-index:-1}
@keyframes pulse{0%{transform:scale(1);opacity:.6}70%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.fest-dot::after{animation:none;opacity:0}}
.fest-dot:hover{border-width:4px}

.map-pop{position:absolute;width:244px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-4);padding:15px 17px;z-index:20;display:none;line-height:1.5}
.map-pop.show{display:block}
.map-pop .close{position:absolute;top:8px;right:10px;border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;line-height:1}
.map-pop .pop-chip{margin-bottom:6px}
.map-pop h4{font-size:14.5px;font-weight:800;letter-spacing:-0.2px;line-height:1.4;margin:2px 0 6px;padding-right:14px}
.map-pop .pop-meta{font-size:12.5px;color:var(--muted);line-height:1.6}
.map-pop .pop-link{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--sea)}
.map-pop .pop-link:hover{text-decoration:underline}
.map-pop::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom:0;border-top-color:var(--white)}
.map-pop.below::after{bottom:auto;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--white)}
@media (max-width:680px){
  .map-legend{display:none}
  .map-pop{width:200px}
  .fest-dot{width:18px;height:18px;border-width:2.5px}
}
</style>

<script>
/* ── 축제별 지도 좌표(이미지 크기 대비 %)와 카드 이모지 ── */
var FEST_META = {
  "tf1": { px:40.5, py:21.0, e:"🛶" },   /* 이호테우해변 — 제주시 서쪽 북해안 */
  "tf2": { px:51.0, py:21.5, e:"🖤" },   /* 삼양검은모래해변 — 제주시 동쪽 */
  "tf3": { px:80.0, py:61.5, e:"🏖️" },  /* 표선해수욕장 — 동남 해안 */
  "tf4": { px:45.8, py:20.3, e:"🎭" },   /* 탑동광장 — 제주시내 */
  "tf5": { px:17.0, py:79.0, e:"🐟" },   /* 모슬포항 — 대정읍 서남단 */
  "tf6": { px:31.5, py:26.5, e:"🌙" },   /* 한담해변 — 애월 북서 해안 */
  "tf7": { px:34.0, py:43.0, e:"🔥" }    /* 새별오름 — 애월 중산간 */
};
var STATE_COLOR = { "진행중":"#f08a24", "예정":"#2b8ce6", "마감":"#9aa4ae" };
var CHIP_CLS = { "진행중":"new", "예정":"region", "마감":"done" };

function esc(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
function fests(){
  return activeFestivals().sort(function(a,b){
    var order = { "진행중":0, "예정":1, "마감":2 };
    var d = (a.head in order ? order[a.head] : 3) - (b.head in order ? order[b.head] : 3);
    return d !== 0 ? d : ((a.start || "") < (b.start || "") ? -1 : 1);
  });
}

/* ── 좌표가 없는 글(운영자 등록 축제)은 장소 이름으로 대략 위치 잡기 (지도 이미지 % 기준) ── */
var LOC_PX = [["우도",92,18],["성산",85,42],["세화",78,27],["월정",74.5,17],["김녕",66,18],["구좌",73,25],["함덕",56,19],["조천",59,25],["표선",80,61],["남원",63,62],["서귀포",53.5,71],["중문",41,73],["안덕",28.5,73],["모슬포",17,79],["대정",18,73],["한경",14,58],["저지",21.5,52.7],["협재",15,49],["한림",22,44],["애월",32,32],["한라산",49,42],["제주시",45.8,25]];
/* 위도·경도 → 지도 그림 위치(%) — 읍면 위치 13곳으로 맞춘 근사식 */
function llPx(lat, lng){
  var px = 91.7334 * lng + 1.56141 * lat - 11611.55, py = -2.94373 * lng - 156.0781 * lat + 5631.30;
  if (!(px > 0 && px < 100 && py > 0 && py < 100)) return null;
  return { px: Math.max(4, Math.min(96, px)), py: Math.max(4, Math.min(96, py)) };
}
function locPx(loc){ loc = loc || ""; for (var i = 0; i < LOC_PX.length; i++) if (loc.indexOf(LOC_PX[i][0]) > -1) return { px: LOC_PX[i][1], py: LOC_PX[i][2] }; return null; }

/* ── 같은 자리(가까운 자리)에 축제가 여러 개면 점을 둥글게 벌려 각각 보이게 ── */
var PLACED = [];
function spread(m){
  var near = PLACED.filter(function(q){ return Math.abs(q.cx - m.px) < 2.6 && Math.abs(q.cy - m.py) < 3.4; })[0];
  var o = { px: m.px, py: m.py, e: m.e };
  if (!near) { PLACED.push({ cx: m.px, cy: m.py, n: 1 }); return o; }
  var k = near.n++, ang = (k - 1) * 2.1 - 1.57, r = 2.4 + Math.floor((k - 1) / 3) * 1.6;   // 2번째부터 원을 따라 배치
  o.px = near.cx + Math.cos(ang) * r; o.py = near.cy + Math.sin(ang) * r * 1.5;
  return o;
}

/* ── 지도에 축제 점 얹기 ── */
(function drawDots(){
  var layer = document.getElementById("dot-layer");
  fests().forEach(function(p){
    var m = FEST_META[p.id] || (p.px ? { px:p.px, py:p.py, e:p.emoji } : (p.lat && p.lng ? llPx(+p.lat, +p.lng) : locPx((p.loc || "") + " " + (p.addr || ""))));
    if (!m) return; // 위치를 알 수 없는 축제는 지도에서 뺌
    m = spread(m);
    var b = document.createElement("button");
    b.className = "fest-dot";
    b.type = "button";
    b.setAttribute("aria-label", p.title);
    b.style.left = m.px + "%";
    b.style.top = m.py + "%";
    b.style.background = STATE_COLOR[p.head] || STATE_COLOR["진행중"];
    b.addEventListener("click", function(ev){ ev.stopPropagation(); openPop(p, m); });
    layer.appendChild(b);
  });
})();

/* ── 점 클릭 팝업 ── */
function openPop(p, m){
  var img = document.getElementById("jeju-img");
  var pop = document.getElementById("map-pop");
  var w = img.clientWidth, h = img.clientHeight;
  var px = m.px / 100 * w;
  var py = m.py / 100 * h;

  document.getElementById("pop-chip").innerHTML = '<span class="chip ' + (CHIP_CLS[p.head] || "new") + '">' + esc(p.head || "진행중") + '</span>';
  document.getElementById("pop-title").textContent = p.title.split(" — ")[0];
  document.getElementById("pop-meta").innerHTML =
    (p.period ? '📅 ' + esc(p.period) + '<br>' : '') + '📍 ' + esc(p.loc || "");
  document.getElementById("pop-link").href = "view.html?id=" + p.id;

  pop.classList.add("show");
  var pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = Math.min(Math.max(px - pw / 2, 8), w - pw - 8);
  var above = py - ph - 22;
  if (above > 8) {
    pop.classList.remove("below");
    pop.style.top = above + "px";
  } else {
    pop.classList.add("below");
    pop.style.top = (py + 22) + "px";
  }
  pop.style.left = left + "px";
}
function closePop(){ document.getElementById("map-pop").classList.remove("show"); }
document.getElementById("map-wrap").addEventListener("click", function(e){
  if (!e.target.closest(".fest-dot") && !e.target.closest(".map-pop")) closePop();
});
window.addEventListener("resize", closePop);

/* ── 목록 렌더링 ── */
var stateFilter = "all";
function applyChip(el){
  el.parentElement.querySelectorAll(".chip-btn").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on");
  stateFilter = el.dataset.filter;
  render();
}
function render(){
  var list = fests().filter(function(p){ return stateFilter === "all" || (p.head || "진행중") === stateFilter; });
  list = premiumFirst(list);
  document.getElementById("shown-count").textContent = list.length;
  document.getElementById("fest-grid").innerHTML = list.map(function(p){
    var isUser = isUserPost(p), isMine = isMyPost(p);
    var head = p.head || "제보";
    return photoCard(p, { pm: isPremium(p), badge: { text: head + (p.kind ? " · " + p.kind : ""), cls: head === "진행중" ? "live" : head === "마감" ? "dark" : "" },
      title: p.title.split(" — ")[0],
      info: (p.period ? '<b>' + esc(p.period) + '</b>' : '') + '<span>' + esc(p.loc || "") + '</span>',
      mine: isMine ? "내 글" : "" });
  }).join("") || '<p style="color:var(--muted);padding:24px">조건에 맞는 축제가 없습니다.</p>';
}
render();
window.onJIData = render;   // 서버에서 새 글을 받아오면 목록을 다시 그림
</script>
