<script>


/* 지역: 주소·동네 이름에 들어 있는 말로 나눔 (예: '구좌읍' → 동부) */
var REGION_WORDS = [
  ["동부", ["구좌", "조천", "성산", "표선", "우도", "함덕", "세화", "김녕"]],
  ["서부", ["애월", "한림", "한경", "대정", "협재", "곽지"]],
  ["서귀포", ["서귀포", "남원", "안덕", "중문", "위미", "대륜", "동홍", "서홍", "효돈", "예래"]],
  ["제주시내", ["제주시", "노형", "연동", "이도", "일도", "삼도", "아라", "오라", "화북", "삼양", "용담", "외도", "이호", "도두", "봉개", "건입"]]
];
function regionOf(p){
  var s = (p.loc || "") + " " + (p.addr || "");
  for (var i = 0; i < REGION_WORDS.length; i++) if (REGION_WORDS[i][1].some(function(w){ return s.indexOf(w) > -1; })) return REGION_WORDS[i][0];
  return "";
}
var META = {
  "tj1":{e:"☕",job:"카페·요식",pay:"시급 11,000원"},
  "tj2":{e:"🏨",job:"숙박·관광",pay:"월 220만원 (숙식 제공)"},
  "tj3":{e:"🧑‍⚕️",job:"복지·의료",pay:"급여 협의"},
  "tj4":{e:"💻",job:"사무·재택",pay:"급여 협의"},
  "tj5":{e:"🍊",job:"농수산",pay:"일급 100,000원"},
  "tj6":{e:"🐟",job:"카페·요식",pay:"시급 12,000원"},
  "tj7":{e:"📊",job:"사무·재택",pay:"월 260만원 희망"},
  "tj8":{e:"🌱",job:"농수산",pay:"일급 90,000원"},
  "tj10":{e:"🤝",job:"복지·의료",pay:"월 240만원"},
  "tj11":{e:"🥐",job:"카페·요식",pay:"시급 12,000원"},
  "tj12":{e:"🍳",job:"카페·요식",pay:"급여 협의"},
  "tj13":{e:"🚗",job:"숙박·관광",pay:"월 230만원"}
};
var regionFilter = "all", kindFilter = "all";
document.querySelectorAll(".job-filter [data-kind], .job-filter [data-region]").forEach(function(b){
  b.onclick = function(){
    var key = b.dataset.kind ? "kind" : "region";
    b.parentElement.querySelectorAll(".chip-btn").forEach(function(c){ c.classList.toggle("on", c === b); });
    if (key === "kind") kindFilter = b.dataset.kind; else regionFilter = b.dataset.region;
    render();
  };
});
document.getElementById("show-closed").onchange = function(){ render(); };
function isClosed(p){ var d = jobDday(p); return (p.head || "") === "채용완료" || (d !== null && d < 0); }
function jobCard(p, isPm){
  var m = META[p.id] || { job: p.job || "기타", pay: p.pay || "급여 협의" };
  var isUser = isUserPost(p), isMine = isMyPost(p);
  var kind = p.head || "구인";
  var pay = p.payType ? payText(p) : (isUser ? (p.price ? parseInt(String(p.price).replace(/[^0-9]/g,""),10).toLocaleString() + "원" : "급여 협의") : m.pay);
  var dd = jobDday(p), dl = kind === "구직" ? "" : jobDeadlineText(p);
  var dlHtml = dl ? ' <em class="jd' + (dd < 0 ? " end" : dd <= 3 ? " soon" : "") + '">' + escHtml(dd > 0 && dd <= 3 ? "마감 임박 · D-" + dd : dl) + '</em>' : '';
  return photoCard(p, { pm: isPm, closed: isClosed(p), badge: { text: kind, cls: (kind === "구직" || kind === "채용완료") ? "dark" : "" },
    info: '<b>' + escHtml(kind === "구직" && !p.payType ? "희망 급여 협의" : pay) + dlHtml + '</b><span>' + escHtml(m.job) + ' · ' + escHtml(p.loc || "지역 미기재") + '</span>',
    mine: isMine ? "내 글" : "" });
}

function render(){
  var showClosed = document.getElementById("show-closed").checked;
  var list = userPostsOf("구인구직").concat(TRADE_SEEDS.filter(function(p){ return p.board === "구인구직"; }));
  list = list.filter(function(p){
    var okR = regionFilter === "all" || regionOf(p) === regionFilter;
    var okK = kindFilter === "all" || (p.head || "구인") === kindFilter;
    return okR && okK && (showClosed || !isClosed(p));
  });
  document.getElementById("shown-count").textContent = list.length;
  renderSections({
    grid: document.getElementById("job-wrap"),
    list: list,
    card: jobCard,
    emptyHtml: emptyInvite("구인구직", "공고")
  });
}
render();
window.onJIData = render;   // 서버에서 새 글을 받아오면 목록을 다시 그림
</script>
