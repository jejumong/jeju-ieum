<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 제주이음</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css?v=20261110r">
</head>
<body data-active="">

<div class="auth-wrap">
  <div class="auth-card">
    <h1>로그인</h1>
    <p class="sub-t">제주이음에 오신 것을 환영합니다</p>

    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" placeholder="비밀번호 입력" autocomplete="current-password">
    </div>

    <button class="btn primary block" onclick="doLogin()">로그인</button>
    <div style="text-align:right;margin-top:10px"><a href="forgot.html" style="font-size:13.5px;color:var(--ink-3)">비밀번호를 잊으셨나요?</a></div>

    <!-- 카카오·네이버 로그인은 앱 등록 후 연결 예정 (지금은 숨김) -->

    <div class="auth-foot">
      아직 회원이 아니신가요? <a href="signup.html">회원가입</a>
    </div>
  </div>
</div>

<script src="assets/common.js?v=20261110r"></script>
<script src="assets/db.js?v=20261110r"></script>
<script src="assets/notify.js?v=20261110r"></script>
<script src="assets/admin-data.js?v=20261110r"></script>
<script>
// 이미 로그인 상태면 홈으로
if (currentUser()) location.href = "index.html";

function doLogin() {
  var email = document.getElementById("email").value.trim().toLowerCase();
  var pw = document.getElementById("pw").value;
  if (!email || !pw) { alert("이메일과 비밀번호를 입력해주세요."); return; }

  var next = new URLSearchParams(location.search).get("next");
  if (window.JIDB && JIDB.enabled) {
    JIDB.ready.then(function(){ return JIDB.signIn(email, pw); }).then(function(){
      location.href = next || "index.html";
    }).catch(function(e){
      var m = String(e && e.message || e);
      if (/invalid login/i.test(m)) m = "이메일 또는 비밀번호가 올바르지 않습니다.";
      else if (/not confirmed/i.test(m)) m = "가입 확인 메일의 링크를 먼저 눌러 주세요.";
      alert(m);
    });
    return;
  }

  var users = JI.get("users", []);
  var u = users.find(function(x){ return x.email === email; });
  if (!u) { alert("등록되지 않은 이메일입니다.\n회원가입 후 이용해주세요."); return; }
  if (u.pw !== pw) { alert("비밀번호가 올바르지 않습니다."); return; }

  JI.set("session", { email: u.email, nick: u.nick, region: u.region });
  location.href = next || "index.html";
}
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });
</script>
</body>
</html>
