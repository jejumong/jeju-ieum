<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f74d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제주이음">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<link rel="stylesheet" href="assets/style.css?v=20261109g">
</head>
<body data-active="">

<div class="auth-wrap">
  <div class="auth-card">
    <h1>비밀번호 찾기</h1>
    <p class="sub-t">가입한 이메일을 넣으면 새 비밀번호를 정하는 링크를 보내 드려요.</p>
    <div id="f-form">
      <div class="field">
        <label for="email">가입한 이메일</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="username">
      </div>
      <button class="btn primary block" id="f-btn" onclick="sendReset()">재설정 링크 받기</button>
    </div>
    <div id="f-done" hidden>
      <div style="background:var(--sea-50);border:1px solid var(--sea-100);border-radius:var(--r);padding:16px 18px;font-size:14.5px;line-height:1.7;color:var(--ink-2)">
        📮 <b id="f-mail"></b> 로 가입된 계정이 있으면 재설정 링크를 보냈어요.<br>
        링크는 <b>30분</b> 동안 쓸 수 있어요.<br>
        몇 분 안에 안 오면 <b>스팸메일함</b>도 확인해 주세요.
      </div>
      <p style="font-size:13.5px;color:var(--ink-3);margin-top:12px;line-height:1.7">그래도 메일이 오지 않으면 <a href="mailto:help@jejuieum.com">help@jejuieum.com</a> 으로 가입한 이메일을 적어 보내 주세요.</p>
    </div>
    <div class="auth-foot"><a href="login.html">로그인으로 돌아가기</a></div>
  </div>
</div>

<script src="assets/common.js?v=20261109g"></script>
<script src="assets/db.js?v=20261109g"></script>
<script>
if (currentUser()) location.href = "index.html";
document.getElementById("email").addEventListener("keydown", function(e){ if (e.key === "Enter") sendReset(); });
function sendReset() {
  var email = document.getElementById("email").value.trim().toLowerCase(), btn = document.getElementById("f-btn");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("이메일을 정확히 입력해 주세요."); return; }
  btn.disabled = true; btn.textContent = "보내는 중…";
  JIDB.call("pw_reset_request", { email: email }).then(function(){
    document.getElementById("f-mail").textContent = email;
    document.getElementById("f-form").hidden = true; document.getElementById("f-done").hidden = false;
  }, function(e){
    alert((e && e.message) || "잠시 후 다시 시도해 주세요.");
    btn.disabled = false; btn.textContent = "재설정 링크 받기";
  });
}
</script>
</body>
</html>
