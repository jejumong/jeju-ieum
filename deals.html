<script>
var META = {
  "td1":{e:"🍊",warm:1,unit:"명"}, "td2":{e:"🥩",warm:1,unit:"명"}, "td3":{e:"🪟",unit:"명"},
  "td4":{e:"🛢️",unit:"가구"}, "td5":{e:"💧",unit:"명"}, "td6":{e:"🐟",warm:1,unit:"명"}
};
var catFilter = "all";

function applyChip(el){
  el.parentElement.querySelectorAll(".chip-btn").forEach(function(c){ c.classList.remove("on"); });
  el.classList.add("on");
  catFilter = el.dataset.filter;
  render();
}
function priceLine(p){
  if (!p.price) return "시세 대비 -5%";
  var n = parseInt(String(p.price).replace(/[^0-9]/g,""), 10);
  var txt = isNaN(n) ? p.price : n.toLocaleString() + "원";
  if (p.was) txt += ' <span style="font-size:12.5px;color:var(--muted);font-weight:500;text-decoration:line-through">' +
    parseInt(String(p.was).replace(/[^0-9]/g,""),10).toLocaleString() + '원</span>';
  return txt;
}
function render(){
  var list = userPostsOf("특가공구").concat(TRADE_SEEDS.filter(function(p){ return p.board === "특가공구"; }));
  list = list.filter(function(p){ return catFilter === "all" || (p.head || "") === catFilter; });
  list = premiumFirst(list.sort(byRecent));
  document.getElementById("shown-count").textContent = list.length;
  document.getElementById("deal-grid").innerHTML = pageSlice(list).map(function(p){
    var m = META[p.id] || { unit:"명" };
    var isUser = isUserPost(p), isMine = isMyPost(p);
    var jid = "deal-" + p.id;
    var pct = (p.cur && p.goal) ? Math.min(100, Math.round(p.cur / p.goal * 100)) : 0;
    var bar = (p.cur && p.goal)
      ? '<div class="progress"><i style="width:' + pct + '%"></i></div><div class="deal-meta"><span>' + p.cur + m.unit + ' / ' + p.goal + m.unit + ' 참여</span><b>' + escHtml(p.dday || "진행중") + '</b></div>'
      : '<div class="deal-meta"><span>' + fmtDate(p.date) + ' 개설</span><b>모집중</b></div>';
    return photoCard(p, { pm: isPremium(p), badge: { text: p.dday || "모집중", cls: "hot" },
      info: '<b>' + priceLine(p) + '</b>',
      extra: bar + '<button type="button" class="btn accent block pc-btn" data-join="' + jid + '" data-kind="deal" data-on="참여 완료 ✓ (다시 누르면 취소)" data-off="참여하기">참여하기</button>',
      mine: isMine ? "내 공구" : "" });
  }).join("") || '<p style="color:var(--muted);padding:24px">조건에 맞는 공구가 없습니다.</p>';
  renderPager("deal-grid", list.length);
  paintAllJoinBtns();
}
render();
</script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var btn = document.getElementById("deal-write-btn");
  if (btn && isApprovedSeller("특가공구")) btn.href = "write.html?board=특가공구";
});
window.onJIData = render;   // 서버에서 새 글을 받아오면 목록을 다시 그림
</script>
